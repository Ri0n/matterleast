name: Apply thread unread domain patch

on:
  push:
    branches:
      - fix-thread-mark-unread-domain

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-thread-mark-unread-domain
      - name: Apply patch
        shell: bash
        run: |
          sed -i 's/@@ -17,5 +17,16/@@ -17,4 +17,15/' .github/patches/thread-unread-domain.patch
          sed -i 's/@@ -449,6 +450,28/@@ -449,6 +450,30/' .github/patches/thread-unread-domain.patch
          sed -i 's/@@ -711,9 +713,9/@@ -711,9 +713,8/' .github/patches/thread-unread-domain.patch
          sed -i 's/@@ -739,7 +741,30/@@ -739,7 +741,31/' .github/patches/thread-unread-domain.patch
          git apply --check .github/patches/thread-unread-domain.patch
          git apply .github/patches/thread-unread-domain.patch
          git diff --check
          git config user.name "Sergei Ilinykh"
          git config user.email "rion4ik@gmail.com"
          git add sources/backend/PostUnreadRequest.h \
                  sources/backend/ThreadFollowService.h \
                  sources/backend/ThreadFollowService.cpp \
                  sources/chat-area/ChatLogWidget.cpp \
                  tests/PostUnreadRequestTest.cpp
          git commit -m "Use CRT endpoint for thread mark unread"
          git push origin HEAD:fix-thread-mark-unread-domain
