name: Patch live-edge bookmark

on:
  push:
    branches:
      - fix-channel-live-edge-bookmark

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-channel-live-edge-bookmark
      - name: Preserve channel live edge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sources/chat-area/ChatArea.cpp')
          s = p.read_text()
          old = '''    if (!isThread && ui && ui->listWidget) {\n        showPinnedPosts(false);\n\n        QString postId;\n        if (ui->listWidget->captureViewportBookmark(postId)) {\n            storedViewportPostId = postId;\n        }\n    }\n'''
          new = '''    if (!isThread && ui && ui->listWidget) {\n        showPinnedPosts(false);\n\n        // The live edge is a viewport state of its own. Reducing it to the\n        // semantic center of the currently visible rows makes reopening a\n        // channel restore that center with Alignment::Center and pulls the\n        // viewport away from the newest post. An empty bookmark means\n        // \"reopen at newest\", so also clear any older stored bookmark here.\n        storedViewportPostId.clear();\n        if (!ui->listWidget->isAtEnd()) {\n            QString postId;\n            if (ui->listWidget->captureViewportBookmark(postId)) {\n                storedViewportPostId = postId;\n            }\n        }\n    }\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one onDeactivate bookmark block, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY

          git diff --check
          git diff -- sources/chat-area/ChatArea.cpp
          git config user.name "Sergei Ilinykh"
          git config user.email "rion4ik@gmail.com"
          git add sources/chat-area/ChatArea.cpp
          git commit -m "Preserve live edge when reopening channels"
          git push origin HEAD:fix-channel-live-edge-bookmark
