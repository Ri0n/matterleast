name: Patch connection reconnect

on:
  push:
    branches:
      - connection-tracking-reconnect

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: connection-tracking-reconnect
          fetch-depth: 0

      - name: Apply reconnect fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:100]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"pattern not unique in {path}: {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          p = 'sources/backend/WebSocketConnector.cpp'
          replace_once(p,
          '''constexpr int HeartbeatIntervalMs = 30000;
          constexpr int MinReconnectDelayMs = 3000;
          constexpr int MaxReconnectDelayMs = 300000;
          constexpr int ReconnectJitterMs = 2000;
          constexpr int BackoffThreshold = 7;''',
          '''constexpr int HeartbeatIntervalMs = 30000;
          constexpr int ConnectionAttemptTimeoutMs = 15000;
          constexpr int MinReconnectDelayMs = 1000;
          constexpr int MaxReconnectDelayMs = 15000;
          constexpr int ReconnectJitterMs = 500;''')

          replace_once(p,
          '''\tQTimer heartbeatTimer;
          \tQTimer reconnectTimer;
          \tQString connectionId;''',
          '''\tQTimer heartbeatTimer;
          \tQTimer reconnectTimer;
          \tQTimer connectionAttemptTimer;
          \tQString connectionId;''')

          replace_once(p,
          '''\tbool resumeFailed = false;
          \tbool helloReceived = false;
          \tbool suppressReconnect = false;
              ConnectionState connectionState = ConnectionState::Disconnected;''',
          '''\tbool resumeFailed = false;
          \tbool helloReceived = false;
          \tbool connectNotified = false;
          \tbool immediateReconnectPending = false;
          \tbool suppressReconnect = false;
              ConnectionState connectionState = ConnectionState::Disconnected;''')

          replace_once(p,
          '''\tconnect (&d->webSocket, &QWebSocket::connected, this, [this] {
          \t\tLOG_DEBUG ("WebSocket connected");
          \t\td->reconnectTimer.stop ();
          \t\td->responseSequence = 1;
          \t\td->helloReceived = false;
          \t\td->resumeFailed = false;
          \t\tdoHandshake ();
          \t\tstartHeartbeat ();
          \t});''',
          '''\tconnect (&d->webSocket, &QWebSocket::connected, this, [this] {
          \t\tLOG_DEBUG ("WebSocket connected");
          \t\td->reconnectTimer.stop ();
          \t\td->responseSequence = 1;
          \t\td->helloReceived = false;
          \t\td->connectNotified = false;
          \t\td->resumeFailed = false;
          \t\tdoHandshake ();
          \t\tstartHeartbeat ();
          \t});''')

          replace_once(p,
          '''\tconnect (&d->webSocket, &QWebSocket::disconnected, this, [this] {
          \t\tstopHeartbeat ();
          \t\td->responseSequence = 1;

          \t\tconst bool reconnectSuppressed = d->suppressReconnect;
          \t\td->suppressReconnect = false;

          \t\tLOG_DEBUG ("WebSocket disconnected. Code: " << d->webSocket.closeCode() << " " << d->webSocket.closeReason());
          \t\temit onDisconnect ();
          \t\td->helloReceived = false;

          \t\tif (!reconnectSuppressed && !d->token.isEmpty()) {
          \t\t\tscheduleReconnect ();
                  } else {
                      setConnectionState(ConnectionState::Disconnected);
          \t\t}
          \t});''',
          '''\tconnect (&d->webSocket, &QWebSocket::disconnected, this, [this] {
          \t\tstopHeartbeat ();
          \t\td->connectionAttemptTimer.stop();
          \t\td->responseSequence = 1;

          \t\tconst bool reconnectSuppressed = d->suppressReconnect;
          \t\td->suppressReconnect = false;

          \t\tLOG_DEBUG ("WebSocket disconnected. Code: " << d->webSocket.closeCode() << " " << d->webSocket.closeReason());
          \t\temit onDisconnect ();
          \t\td->helloReceived = false;
          \t\td->connectNotified = false;

          \t\tif (d->immediateReconnectPending && !reconnectSuppressed && !d->token.isEmpty()) {
          \t\t\td->immediateReconnectPending = false;
          \t\t\tLOG_DEBUG("WebSocket restarting immediately after forced reconnect");
          \t\t\topenSocket();
          \t\t\treturn;
          \t\t}
          \t\td->immediateReconnectPending = false;

          \t\tif (!reconnectSuppressed && !d->token.isEmpty()) {
          \t\t\tscheduleReconnect ();
                  } else {
                      setConnectionState(ConnectionState::Disconnected);
          \t\t}
          \t});''')

          replace_once(p,
          '''\td->reconnectTimer.setSingleShot (true);
          \tconnect (&d->reconnectTimer, &QTimer::timeout, this, [this] {
          \t\tif (d->token.isEmpty() || d->suppressReconnect) {
          \t\t\treturn;
          \t\t}
          \t\tif (d->webSocket.state() != QAbstractSocket::UnconnectedState) {
          \t\t\treturn;
          \t\t}

          \t\tLOG_DEBUG ("WebSocket Reconnecting (connection_id=" << d->connectionId
          \t\t\t\t   << ", sequence_number=" << d->serverSequence << ")");
          \t\topenSocket ();
          \t});''',
          '''\td->reconnectTimer.setSingleShot (true);
          \tconnect (&d->reconnectTimer, &QTimer::timeout, this, [this] {
          \t\tif (d->token.isEmpty() || d->suppressReconnect) {
          \t\t\treturn;
          \t\t}
          \t\tif (d->webSocket.state() != QAbstractSocket::UnconnectedState) {
          \t\t\treturn;
          \t\t}

          \t\tLOG_DEBUG ("WebSocket Reconnecting (connection_id=" << d->connectionId
          \t\t\t\t   << ", sequence_number=" << d->serverSequence << ")");
          \t\topenSocket ();
          \t});

          \td->connectionAttemptTimer.setSingleShot(true);
          \tconnect(&d->connectionAttemptTimer, &QTimer::timeout, this, [this] {
          \t\tif (d->token.isEmpty() || d->suppressReconnect
          \t\t    || d->connectionState == ConnectionState::Connected) {
          \t\t\treturn;
          \t\t}

          \t\tLOG_DEBUG("WebSocket connection attempt timed out after "
          \t\t          << ConnectionAttemptTimeoutMs << " ms");
          \t\tif (d->webSocket.state() == QAbstractSocket::UnconnectedState) {
          \t\t\tscheduleReconnect();
          \t\t} else {
          \t\t\td->webSocket.abort();
          \t\t}
          \t});''')

          replace_once(p,
          '''                if (d->connectionState == ConnectionState::WaitingForReconnect) {
                              LOG_DEBUG("Network reachability changed while waiting to reconnect");
                              reconnectNow();
                          }''',
          '''                if (d->connectionState == ConnectionState::WaitingForReconnect
                              || d->connectionState == ConnectionState::Connecting) {
                              LOG_DEBUG("Network reachability changed while reconnecting");
                              reconnectNow();
                          }''')

          replace_once(p,
          '''                if (d->connectionState == ConnectionState::WaitingForReconnect) {
                              LOG_DEBUG("Network transport changed while waiting to reconnect");
                              reconnectNow();
                          }''',
          '''                if (d->connectionState == ConnectionState::WaitingForReconnect
                              || d->connectionState == ConnectionState::Connecting) {
                              LOG_DEBUG("Network transport changed while reconnecting");
                              reconnectNow();
                          }''')

          replace_once(p,
          '''void WebSocketConnector::reconnectNow()
          {
              if (d->connectionState != ConnectionState::WaitingForReconnect
                  || d->token.isEmpty() || d->suppressReconnect
                  || d->webSocket.state() != QAbstractSocket::UnconnectedState) {
                  return;
              }

              d->reconnectTimer.stop();
              LOG_DEBUG("WebSocket reconnect requested immediately (connection_id="
                        << d->connectionId << ", sequence_number=" << d->serverSequence << ")");
              openSocket();
          }''',
          '''void WebSocketConnector::reconnectNow()
          {
              if (d->token.isEmpty() || d->suppressReconnect
                  || d->connectionState == ConnectionState::Connected) {
                  return;
              }

              d->reconnectTimer.stop();
              d->connectionAttemptTimer.stop();
              LOG_DEBUG("WebSocket reconnect requested immediately (connection_state="
                        << static_cast<int>(d->connectionState)
                        << ", socket_state=" << static_cast<int>(d->webSocket.state())
                        << ", connection_id=" << d->connectionId
                        << ", sequence_number=" << d->serverSequence << ")");

              if (d->webSocket.state() == QAbstractSocket::UnconnectedState) {
                  d->immediateReconnectPending = false;
                  openSocket();
                  return;
              }

              d->immediateReconnectPending = true;
              d->webSocket.abort();
              QTimer::singleShot(0, this, [this] {
                  if (!d->immediateReconnectPending || d->token.isEmpty()
                      || d->suppressReconnect
                      || d->webSocket.state() != QAbstractSocket::UnconnectedState) {
                      return;
                  }
                  d->immediateReconnectPending = false;
                  openSocket();
              });
          }''')

          replace_once(p,
          '''\td->resumeFailed = false;
          \td->helloReceived = false;
          \td->suppressReconnect = false;
          \td->reconnectTimer.stop ();
          \tstopHeartbeat ();''',
          '''\td->resumeFailed = false;
          \td->helloReceived = false;
          \td->connectNotified = false;
          \td->immediateReconnectPending = false;
          \td->suppressReconnect = false;
          \td->reconnectTimer.stop ();
          \td->connectionAttemptTimer.stop();
          \tstopHeartbeat ();''')

          replace_once(p,
          '''\tif (d->token.isEmpty() || d->suppressReconnect || d->reconnectTimer.isActive()) {
          \t\treturn;
          \t}''',
          '''\tif (d->token.isEmpty() || d->suppressReconnect || d->immediateReconnectPending
          \t    || d->reconnectTimer.isActive()) {
          \t\treturn;
          \t}''')

          replace_once(p,
          '''\td->hasReconnect = true;
          \t++d->reconnectAttempt;

          \tint delay = MinReconnectDelayMs;
          \tif (d->reconnectAttempt > BackoffThreshold) {
          \t\tconst qint64 scaledDelay = static_cast<qint64>(MinReconnectDelayMs)
          \t\t\t* d->reconnectAttempt * d->reconnectAttempt;
          \t\tdelay = static_cast<int>(qMin<qint64>(scaledDelay, MaxReconnectDelayMs));
          \t}
          \tdelay += static_cast<int>(QRandomGenerator::global()->bounded(static_cast<quint32>(ReconnectJitterMs)));

          \tLOG_DEBUG ("WebSocket reconnect scheduled in " << delay << " ms");''',
          '''\td->hasReconnect = true;
          \t++d->reconnectAttempt;

          \tconst int exponent = qBound(0, d->reconnectAttempt - 1, 4);
          \tint delay = qMin(MaxReconnectDelayMs, MinReconnectDelayMs * (1 << exponent));
          \tif (delay < MaxReconnectDelayMs) {
          \t\tdelay = qMin(MaxReconnectDelayMs,
          \t\t             delay + static_cast<int>(QRandomGenerator::global()->bounded(
          \t\t                         static_cast<quint32>(ReconnectJitterMs))));
          \t}

          \tLOG_DEBUG ("WebSocket reconnect attempt " << d->reconnectAttempt
          \t\t       << " scheduled in " << delay << " ms");''')

          replace_once(p,
          '''\td->webSocket.open (request);
          }''',
          '''\td->connectionAttemptTimer.start(ConnectionAttemptTimeoutMs);
          \td->webSocket.open (request);
          }''')

          replace_once(p,
          '''\td->reconnectTimer.stop ();
          \tstopHeartbeat ();
          \td->connectionId.clear ();''',
          '''\td->reconnectTimer.stop ();
          \td->connectionAttemptTimer.stop();
          \tstopHeartbeat ();
          \td->connectionId.clear ();''')

          replace_once(p,
          '''\td->resumeFailed = false;
          \td->helloReceived = false;
              setConnectionState(ConnectionState::Disconnected);''',
          '''\td->resumeFailed = false;
          \td->helloReceived = false;
          \td->connectNotified = false;
          \td->immediateReconnectPending = false;
              setConnectionState(ConnectionState::Disconnected);''')

          replace_once(p,
          '''\tif (eventName == QStringLiteral("hello")) {
          \t\tconst QString oldConnectionId = d->connectionId;''',
          '''\tif (eventName == QStringLiteral("hello")) {
          \t\td->helloReceived = true;
          \t\tconst QString oldConnectionId = d->connectionId;''')

          replace_once(p,
          '''\tif (eventName == QStringLiteral("hello") && !d->helloReceived) {
          \t\td->helloReceived = true;
          \t\td->reconnectAttempt = 0;

          \t\t// Historically the signal's bool meant "a socket reconnect occurred",
          \t\t// and Backend consequently performed a full HTTP resync after every
          \t\t// transient disconnect. Keep the signal ABI but narrow the bool to the
          \t\t// only condition that needs that fallback: reliable replay failed.
          \t\tconst bool needsHttpResync = d->hasReconnect && d->resumeFailed;
          \t\td->hasReconnect = false;
          \t\td->resumeFailed = false;
                  setConnectionState(ConnectionState::Connected);
          \t\temit onConnect (needsHttpResync);
          \t}''',
          '''\tconst bool sequencedEvent = !eventSequenceValue.isUndefined();
          \tif (!d->connectNotified
          \t    && (eventName == QStringLiteral("hello") || sequencedEvent)) {
          \t\td->connectNotified = true;
          \t\td->connectionAttemptTimer.stop();
          \t\td->reconnectAttempt = 0;

          \t\tconst bool isReconnect = d->hasReconnect;
          \t\tconst bool needsHttpResync = isReconnect && d->resumeFailed;
          \t\tif (isReconnect && eventName != QStringLiteral("hello")) {
          \t\t\tLOG_DEBUG("Mattermost resumed the WebSocket stream without a hello event; "
          \t\t\t          "a correctly sequenced event proves the resumed stream is live");
          \t\t}
          \t\td->hasReconnect = false;
          \t\td->resumeFailed = false;
                  setConnectionState(ConnectionState::Connected);
          \t\temit onConnect(isReconnect, needsHttpResync);
          \t}''')

          p = 'sources/backend/WebSocketConnector.h'
          replace_once(p,
          '''\tvoid onConnect (bool isReconnect);''',
          '''\tvoid onConnect (bool isReconnect, bool needsHttpResync);''')

          p = 'sources/backend/Backend.cpp'
          replace_once(p,
          '''\tconnect (&webSocketConnector, &WebSocketConnector::onConnect, [this] (bool isReconnect) {

          \t\temit onWebSocketConnect ();

          \t\tif (isReconnect) {
          \t\t\tLOG_DEBUG ("Reconnect - check for missed posts");

          \t\t\t/**
          \t\t\t * Reset the HTTP connector, so that all waiting requests are cancelled.
          \t\t\t * Each element that has sent a request should verify if it has arrived
          \t\t\t * and resend it (using the onWebSocketDisconnect / onWebSocketConnect signal).
          \t\t\t * Without the httpconnector reset, there may be stuck requests
          \t\t\t */
          \t\t\thttpConnector.reset ();

          \t\t\t// Reliable WebSocket replay already covers normal reconnects. If
          \t\t\t// replay explicitly failed, validate only the conversation the user
          \t\t\t// is looking at. Bulk-resyncing every joined channel turns one broken
          \t\t\t// socket into hundreds of history and pinned-post requests.
          \t\t\tif (currentChannel) {
          \t\t\t\tretrieveChannelPosts (*currentChannel, 0, 25);
          \t\t\t}
          \t\t}
          \t});''',
          '''\tconnect (&webSocketConnector, &WebSocketConnector::onConnect,
          \t         [this] (bool isReconnect, bool needsHttpResync) {
          \t\tif (isReconnect) {
          \t\t\tLOG_DEBUG("WebSocket reconnected - resetting HTTP transport");

          \t\t\t/**
          \t\t\t * A route/interface change can leave QNetworkAccessManager requests
          \t\t\t * bound to the dead path even after a fresh WebSocket succeeds.
          \t\t\t * Replace the HTTP transport before notifying listeners so their
          \t\t\t * onWebSocketConnect retries are issued on the new network path.
          \t\t\t */
          \t\t\thttpConnector.reset();
          \t\t}

          \t\temit onWebSocketConnect();

          \t\t// Reliable WebSocket replay covers normal reconnects. Only when the
          \t\t// server explicitly started a new stream do we need a history fallback.
          \t\tif (needsHttpResync && currentChannel) {
          \t\t\tLOG_DEBUG("Reliable WebSocket resume failed - refreshing current channel");
          \t\t\tretrieveChannelPosts(*currentChannel, 0, 25);
          \t\t}
          \t});''')

          p = 'sources/ui/PresenceAvatarLabel.h'
          replace_once(p,
          '''    int connectionAnimationPhase = 0;
          };''',
          '''    int connectionAnimationPhase = 0;
              int connectionAnimationDirection = 1;
          };''')

          p = 'sources/ui/PresenceAvatarLabel.cpp'
          replace_once(p,
          '''        connectionAnimationPhase =
                      (connectionAnimationPhase + 1) % BusyIndicator::AnimationSteps;''',
          '''        connectionAnimationPhase =
                      (connectionAnimationPhase + connectionAnimationDirection
                       + BusyIndicator::AnimationSteps)
                      % BusyIndicator::AnimationSteps;''')

          replace_once(p,
          '''        connectionAnimationTimer.stop();
                  connectionAnimationPhase = 0;
                  setToolTip(QString());''',
          '''        connectionAnimationTimer.stop();
                  connectionAnimationPhase = 0;
                  connectionAnimationDirection = 1;
                  setToolTip(QString());''')

          replace_once(p,
          '''        setToolTip(connectionState == ConnectionIndicatorState::WaitingForReconnect
                                 ? tr("Reconnecting to Mattermost… Click the indicator to retry now.")
                                 : tr("Connecting to Mattermost…"));''',
          '''        setToolTip(connectionState == ConnectionIndicatorState::WaitingForReconnect
                                 ? tr("Waiting to reconnect to Mattermost… Click the indicator to retry now.")
                                 : tr("Connecting to Mattermost… Click the indicator to retry now."));''')

          replace_once(p,
          '''        QLabel::mouseReleaseEvent(event);
                  if (connectionState == ConnectionIndicatorState::WaitingForReconnect) {
                      emit reconnectRequested();
                  }
                  return;''',
          '''        QLabel::mouseReleaseEvent(event);
                  connectionAnimationDirection = -connectionAnimationDirection;
                  connectionAnimationPhase =
                      (connectionAnimationPhase + connectionAnimationDirection
                       + BusyIndicator::AnimationSteps)
                      % BusyIndicator::AnimationSteps;
                  update();
                  emit reconnectRequested();
                  return;''')

          p = 'tests/PresenceAvatarLabelTest.cpp'
          replace_once(p,
          '''        label.setConnectionIndicatorState(
                      PresenceAvatarLabel::ConnectionIndicatorState::Connecting);
                  QTest::mouseClick(&label, Qt::LeftButton, Qt::NoModifier, QPoint(42, 42));
                  QCOMPARE(reconnectSpy.count(), 0);
                  QCOMPARE(avatarClickSpy.count(), 0);

                  label.setConnectionIndicatorState(
                      PresenceAvatarLabel::ConnectionIndicatorState::WaitingForReconnect);
                  QTest::mouseClick(&label, Qt::LeftButton, Qt::NoModifier, QPoint(42, 42));
                  QCOMPARE(reconnectSpy.count(), 1);
                  QCOMPARE(avatarClickSpy.count(), 0);

                  QTest::mouseClick(&label, Qt::LeftButton, Qt::NoModifier, QPoint(10, 10));
                  QCOMPARE(reconnectSpy.count(), 1);
                  QCOMPARE(avatarClickSpy.count(), 1);''',
          '''        label.setConnectionIndicatorState(
                      PresenceAvatarLabel::ConnectionIndicatorState::Connecting);
                  QTest::mouseClick(&label, Qt::LeftButton, Qt::NoModifier, QPoint(42, 42));
                  QCOMPARE(reconnectSpy.count(), 1);
                  QCOMPARE(avatarClickSpy.count(), 0);

                  label.setConnectionIndicatorState(
                      PresenceAvatarLabel::ConnectionIndicatorState::WaitingForReconnect);
                  QTest::mouseClick(&label, Qt::LeftButton, Qt::NoModifier, QPoint(42, 42));
                  QCOMPARE(reconnectSpy.count(), 2);
                  QCOMPARE(avatarClickSpy.count(), 0);

                  QTest::mouseClick(&label, Qt::LeftButton, Qt::NoModifier, QPoint(10, 10));
                  QCOMPARE(reconnectSpy.count(), 2);
                  QCOMPARE(avatarClickSpy.count(), 1);''')
          PY

          rm .github/workflows/patch-connection-reconnect.yml

          git config user.name "Sergei Ilinykh"
          git config user.email "rion4ik@gmail.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Harden reconnect recovery after network changes"
          git push origin HEAD:connection-tracking-reconnect
