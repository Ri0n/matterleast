name: Patch connection auth readiness

on:
  push:
    branches:
      - connection-tracking-reconnect

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: connection-tracking-reconnect
          fetch-depth: 0
      - name: Apply auth readiness fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"pattern not unique in {path}: {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          p = 'sources/backend/WebSocketConnector.cpp'
          replace_once(p,
          '''\tint pendingPingSequence = 0;
          \tint reconnectAttempt = 0;''',
          '''\tint pendingPingSequence = 0;
          \tint pendingAuthenticationSequence = 0;
          \tint reconnectAttempt = 0;''')

          replace_once(p,
          '''void WebSocketConnector::setConnectionState(ConnectionState state)
          {
              if (d->connectionState == state) {
                  return;
              }
              d->connectionState = state;
              emit connectionStateChanged(state);
          }''',
          '''void WebSocketConnector::setConnectionState(ConnectionState state)
          {
              if (d->connectionState == state) {
                  return;
              }
              LOG_DEBUG("WebSocket connection state " << static_cast<int>(d->connectionState)
                        << " -> " << static_cast<int>(state));
              d->connectionState = state;
              emit connectionStateChanged(state);
          }''')

          replace_once(p,
          '''\td->pendingPingSequence = 0;
          \td->reconnectAttempt = 0;''',
          '''\td->pendingPingSequence = 0;
          \td->pendingAuthenticationSequence = 0;
          \td->reconnectAttempt = 0;''')

          replace_once(p,
          '''\tconst int sequence = d->responseSequence++;
          \tQJsonDocument json (QJsonObject {''',
          '''\tconst int sequence = d->responseSequence++;
          \td->pendingAuthenticationSequence = sequence;
          \tQJsonDocument json (QJsonObject {''')

          replace_once(p,
          '''\td->pendingPingSequence = 0;
          \td->reconnectAttempt = 0;
          \td->hasReconnect = false;''',
          '''\td->pendingPingSequence = 0;
          \td->pendingAuthenticationSequence = 0;
          \td->reconnectAttempt = 0;
          \td->hasReconnect = false;''')

          replace_once(p,
          '''\tconst QJsonValue seqReply = jsonObject.value (QStringLiteral("seq_reply"));
          \tif (!seqReply.isUndefined()) {
          \t\tconst int replySequence = seqReply.toInt ();
          \t\tif (d->waitingForPong && replySequence == d->pendingPingSequence) {
          \t\t\td->waitingForPong = false;
          \t\t\td->pendingPingSequence = 0;
          \t\t}

          \t\tif (jsonObject.contains(QStringLiteral("error"))) {
          \t\t\tLOG_DEBUG ("WebSocket action failed: " << doc.toJson(QJsonDocument::Compact));
          \t\t}
          \t\treturn;
          \t}''',
          '''\tconst QJsonValue seqReply = jsonObject.value (QStringLiteral("seq_reply"));
          \tif (!seqReply.isUndefined()) {
          \t\tconst int replySequence = seqReply.toInt ();
          \t\tif (d->waitingForPong && replySequence == d->pendingPingSequence) {
          \t\t\td->waitingForPong = false;
          \t\t\td->pendingPingSequence = 0;
          \t\t}

          \t\tconst bool actionFailed = jsonObject.contains(QStringLiteral("error"));
          \t\tif (replySequence == d->pendingAuthenticationSequence) {
          \t\t\td->pendingAuthenticationSequence = 0;
          \t\t\tif (actionFailed) {
          \t\t\t\tLOG_DEBUG("WebSocket authentication challenge failed: "
          \t\t\t\t          << doc.toJson(QJsonDocument::Compact));
          \t\t\t\td->webSocket.abort();
          \t\t\t\treturn;
          \t\t\t}

          \t\t\tif (!d->connectNotified) {
          \t\t\t\td->connectNotified = true;
          \t\t\t\td->connectionAttemptTimer.stop();
          \t\t\t\td->reconnectAttempt = 0;
          \t\t\t\tconst bool isReconnect = d->hasReconnect;
          \t\t\t\tsetConnectionState(ConnectionState::Connected);
          \t\t\t\temit onConnect(isReconnect, false);
          \t\t\t}
          \t\t}

          \t\tif (actionFailed) {
          \t\t\tLOG_DEBUG ("WebSocket action failed: " << doc.toJson(QJsonDocument::Compact));
          \t\t}
          \t\treturn;
          \t}''')

          replace_once(p,
          '''\tconst bool sequencedEvent = !eventSequenceValue.isUndefined();
          \tif (!d->connectNotified
          \t    && (eventName == QStringLiteral("hello") || sequencedEvent)) {
          \t\td->connectNotified = true;
          \t\td->connectionAttemptTimer.stop();
          \t\td->reconnectAttempt = 0;

          \t\tconst bool isReconnect = d->hasReconnect;
          \t\tconst bool needsHttpResync = isReconnect && d->resumeFailed;
          \t\tif (isReconnect && eventName != QStringLiteral("hello")) {
          \t\t\tLOG_DEBUG("Mattermost resumed the WebSocket stream without a hello event; "
          \t\t\t          "a correctly sequenced event proves the resumed stream is live");
          \t\t}
          \t\td->hasReconnect = false;
          \t\td->resumeFailed = false;
                  setConnectionState(ConnectionState::Connected);
          \t\temit onConnect(isReconnect, needsHttpResync);
          \t}''',
          '''\tconst bool sequencedEvent = !eventSequenceValue.isUndefined();
          \tif (!d->connectNotified
          \t    && (eventName == QStringLiteral("hello") || sequencedEvent)) {
          \t\td->connectNotified = true;
          \t\td->connectionAttemptTimer.stop();
          \t\td->reconnectAttempt = 0;

          \t\tconst bool isReconnect = d->hasReconnect;
          \t\tconst bool needsHttpResync = isReconnect && d->resumeFailed;
          \t\tif (isReconnect && eventName != QStringLiteral("hello")) {
          \t\t\tLOG_DEBUG("Mattermost resumed the WebSocket stream without a hello event; "
          \t\t\t          "a correctly sequenced event proves the resumed stream is live");
          \t\t}
          \t\td->hasReconnect = false;
          \t\td->resumeFailed = false;
                  setConnectionState(ConnectionState::Connected);
          \t\temit onConnect(isReconnect, needsHttpResync);
          \t} else if (d->connectNotified && d->hasReconnect
          \t           && eventName == QStringLiteral("hello")) {
          \t\tconst bool needsHttpResync = d->resumeFailed;
          \t\td->hasReconnect = false;
          \t\td->resumeFailed = false;
          \t\tif (needsHttpResync) {
          \t\t\tLOG_DEBUG("Reliable WebSocket resume was rejected after authentication");
          \t\t\temit reliableResumeFailed();
          \t\t}
          \t} else if (d->connectNotified && d->hasReconnect && sequencedEvent) {
          \t\tLOG_DEBUG("Mattermost reliable WebSocket resume confirmed by sequenced event");
          \t\td->hasReconnect = false;
          \t\td->resumeFailed = false;
          \t}''')

          p = 'sources/backend/WebSocketConnector.h'
          replace_once(p,
          '''\tvoid onConnect (bool isReconnect, bool needsHttpResync);
          \tvoid onDisconnect ();''',
          '''\tvoid onConnect (bool isReconnect, bool needsHttpResync);
          \tvoid reliableResumeFailed();
          \tvoid onDisconnect ();''')

          p = 'sources/backend/Backend.cpp'
          replace_once(p,
          '''\t});

          \t//these signals are proxied
          \tconnect (&webSocketConnector, &WebSocketConnector::onDisconnect, this, &Backend::onWebSocketDisconnect);''',
          '''\t});

          \tconnect(&webSocketConnector, &WebSocketConnector::reliableResumeFailed,
          \t        this, [this] {
          \t\tLOG_DEBUG("Reliable WebSocket resume failed after authentication");
          \t\tif (currentChannel) {
          \t\t\tretrieveChannelPosts(*currentChannel, 0, 25);
          \t\t}
          \t});

          \t//these signals are proxied
          \tconnect (&webSocketConnector, &WebSocketConnector::onDisconnect, this, &Backend::onWebSocketDisconnect);''')

          p = 'tests/PresenceAvatarLabelTest.cpp'
          replace_once(p,
          '''    void reconnectRequestOnlyComesFromWaitingBadge()''',
          '''    void reconnectRequestComesFromConnectionBadge()''')
          PY

          rm .github/workflows/patch-connection-auth-ready.yml
          git config user.name "Sergei Ilinykh"
          git config user.email "rion4ik@gmail.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Treat authenticated reconnects as live"
          git push origin HEAD:connection-tracking-reconnect
