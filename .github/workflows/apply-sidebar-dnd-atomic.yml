name: Apply atomic sidebar DnD geometry

on:
  push:
    branches:
      - feature/sidebar-optimistic-dnd

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sidebar-optimistic-dnd
      - name: Apply geometry transaction patch
        run: python3 .github/scripts/patch_sidebar_dnd_atomic.py
      - name: Remove temporary patch files
        run: git rm .github/scripts/patch_sidebar_dnd_atomic.py .github/workflows/apply-sidebar-dnd-atomic.yml
      - name: Commit implementation
        run: |
          git config user.name "Sergei Ilinykh"
          git config user.email "rion4ik@gmail.com"
          git add sources/channel-tree/ChannelTreeDragVisuals.cpp
          git diff --cached --check
          git commit -m "Apply sidebar drag geometry atomically"
          git push origin HEAD:feature/sidebar-optimistic-dnd
