name: Apply deferred sidebar reconcile during DnD

on:
  push:
    branches:
      - feature/sidebar-optimistic-dnd
    paths:
      - tools/apply_sidebar_dnd_deferred_reconcile.py
      - .github/workflows/apply-sidebar-dnd-deferred-reconcile.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sidebar-optimistic-dnd
      - name: Apply deferred reconcile patch
        run: python3 tools/apply_sidebar_dnd_deferred_reconcile.py
      - name: Remove temporary patch files
        run: |
          rm tools/apply_sidebar_dnd_deferred_reconcile.py
          rm .github/workflows/apply-sidebar-dnd-deferred-reconcile.yml
      - name: Commit implementation
        run: |
          git config user.name "Sergei Ilinykh"
          git config user.email "rion4ik@gmail.com"
          git add -A
          git commit -m "Defer sidebar reconcile during drag"
          git push origin HEAD:feature/sidebar-optimistic-dnd
