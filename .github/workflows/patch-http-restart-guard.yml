name: Patch HTTP restart guard

on:
  push:
    branches:
      - connection-tracking-reconnect

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: connection-tracking-reconnect
      - name: Guard queue dispatch during transport restart
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sources/backend/HTTPConnector.cpp')
          s = p.read_text()
          old = '''\tfor (HTTPConnector* connector : connectors) {\n\t\tif (!connector) {\n\t\t\tcontinue;\n\t\t}\n\t\tconst auto& queue = lowPriority\n'''
          new = '''\tfor (HTTPConnector* connector : connectors) {\n\t\tif (!connector || connector->restartingTransport) {\n\t\t\tcontinue;\n\t\t}\n\t\tconst auto& queue = lowPriority\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one connectorWithPendingRequest pattern, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- sources/backend/HTTPConnector.cpp
          git config user.name "Sergei Ilinykh"
          git config user.email "rion4ik@gmail.com"
          git add sources/backend/HTTPConnector.cpp
          git commit -m "Guard HTTP queue during transport restart"
          git push origin HEAD:connection-tracking-reconnect
