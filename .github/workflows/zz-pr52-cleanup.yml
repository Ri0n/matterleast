name: Apply PR 52 cleanup

on:
  push:
    branches:
      - fix/four-ui-data-regressions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/four-ui-data-regressions
          fetch-depth: 0

      - name: Apply cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              path.write_text(text.replace(old, new, 1))

          def replace_between(path, start, end, replacement):
              text = path.read_text()
              first = text.find(start)
              if first < 0:
                  raise SystemExit(f"{path}: start marker not found")
              last = text.find(end, first)
              if last < 0:
                  raise SystemExit(f"{path}: end marker not found")
              path.write_text(text[:first] + replacement + text[last:])

          channel_tree = Path("sources/channel-tree/ChannelTree.cpp")
          replace_once(
              channel_tree,
              "    connect(&sidebar, &SidebarService::channelActivityChanged, this,\n"
              "            [this, &sidebar](const QString& channelId) {\n"
              "        if (!backendForSidebar) {\n"
              "            return;\n"
              "        }\n"
              "        BackendChannel* channel = backendForSidebar->getStorage().getChannelById(channelId);\n"
              "        if (channel) {\n"
              "            setChannelUnreadVisual(channelId, sidebar.isChannelUnread(*channel));\n"
              "        }\n"
              "    });\n",
              "    connect(&sidebar, &SidebarService::channelActivityChanged,\n"
              "            this, &ChannelTree::refreshChannelUnreadVisual, Qt::UniqueConnection);\n",
          )
          unread_marker = "void ChannelTree::setChannelUnreadVisual(const QString& channelId, bool unread)\n"
          unread_handler = (
              "void ChannelTree::refreshChannelUnreadVisual(const QString& channelId)\n"
              "{\n"
              "    if (!backendForSidebar) {\n"
              "        return;\n"
              "    }\n\n"
              "    BackendChannel* channel = backendForSidebar->getStorage().getChannelById(channelId);\n"
              "    if (!channel) {\n"
              "        return;\n"
              "    }\n\n"
              "    setChannelUnreadVisual(\n"
              "        channelId, SidebarService::instance(*backendForSidebar).isChannelUnread(*channel));\n"
              "}\n\n"
          )
          replace_once(channel_tree, unread_marker, unread_handler + unread_marker)

          following = Path("sources/backend/FollowingModel.cpp")
          mark_thread_read = (
              "void FollowingModel::markThreadRead(const QString& teamId,\n"
              "                                    const QString& threadId,\n"
              "                                    std::function<void(bool)> callback)\n"
              "{\n"
              "    if (teamId.isEmpty() || threadId.isEmpty()) {\n"
              "        if (callback) {\n"
              "            callback(false);\n"
              "        }\n"
              "        return;\n"
              "    }\n\n"
              "    QString manualKey;\n"
              "    if (Entry* entry = findThreadMutable(threadId)) {\n"
              "        manualKey = manualUnreadKey(entry->channelId, threadId);\n"
              "        entry->unreadReplies = 0;\n"
              "        entry->unreadMentions = 0;\n"
              "        entry->mentioned = false;\n"
              "        entry->attentionSince = 0;\n"
              "        entry->readAcknowledgementPending = true;\n"
              "        // CRT snapshots and post create_at/last_reply_at values live on the\n"
              "        // server timeline. Comparing them with the client's wall clock makes a\n"
              "        // small clock skew resurrect a tail that was already visibly consumed.\n"
              "        entry->readAcknowledgementAt = entry->readThroughCreateAt != 0\n"
              "            ? entry->readThroughCreateAt\n"
              "            : entry->lastReplyAt;\n"
              "        emit changed();\n"
              "    }\n\n"
              "    QPointer<FollowingModel> guard(this);\n"
              "    ThreadFollowService::instance(backend_).markThreadRead(\n"
              "        teamId, threadId,\n"
              "        [guard, threadId, manualKey, callback = std::move(callback)](bool success) mutable {\n"
              "            if (!guard) {\n"
              "                return;\n"
              "            }\n\n"
              "            if (!success) {\n"
              "                if (Entry* entry = guard->findThreadMutable(threadId)) {\n"
              "                    entry->readAcknowledgementPending = false;\n"
              "                    entry->readAcknowledgementAt = 0;\n"
              "                }\n"
              "            } else if (!manualKey.isEmpty()) {\n"
              "                guard->manualUnreadMarkers_.remove(manualKey);\n"
              "                guard->manualAttentionKeys_.remove(manualKey);\n"
              "            }\n\n"
              "            // On failure the retained manual-attention key makes the next CRT\n"
              "            // snapshot restore the unread thread. On success the server snapshot\n"
              "            // confirms and retires the optimistic read acknowledgement.\n"
              "            guard->scheduleThreadRefresh();\n\n"
              "            if (callback) {\n"
              "                callback(success);\n"
              "            }\n"
              "        });\n"
              "}\n"
          )
          replace_between(
              following,
              "void FollowingModel::markThreadRead(const QString& teamId,\n",
              "\n\n} // namespace Mattermost",
              mark_thread_read,
          )

          user_profile = Path("sources/backend/UserProfileService.cpp")
          replace_once(
              user_profile,
              "            BackendUser* currentUser = backend.getStorage().getUserById(userId);\n"
              "            if (!currentUser || currentUser->last_picture_update != pictureVersion) {\n"
              "                return;\n"
              "            }            QPixmap pixmap = decodeAvatarImage(data);\n"
              "  if (pixmap.isNull()) {\n"
              "      return;\n"
              "  }\n\n"
              "  // BackendUser owns the original pixels. Small chat/sidebar avatars\n"
              "  // are scaled at their presentation sites; profile dialogs need 128px.\n"
              "  currentUser->avatar = std::move(pixmap);\n"
              "currentUser->avatar_picture_update = pictureVersion;\n"
              "            emit currentUser->onAvatarChanged();\n",
              "            BackendUser* currentUser = backend.getStorage().getUserById(userId);\n"
              "            if (!currentUser || currentUser->last_picture_update != pictureVersion) {\n"
              "                return;\n"
              "            }\n\n"
              "            QPixmap pixmap = decodeAvatarImage(data);\n"
              "            if (pixmap.isNull()) {\n"
              "                return;\n"
              "            }\n\n"
              "            // BackendUser owns the original pixels. Small chat/sidebar avatars\n"
              "            // are scaled at their presentation sites; profile dialogs need 128px.\n"
              "            currentUser->avatar = std::move(pixmap);\n"
              "            currentUser->avatar_picture_update = pictureVersion;\n"
              "            emit currentUser->onAvatarChanged();\n",
          )

          chat_area = Path("sources/chat-area/ChatArea.cpp")
          replace_once(
              chat_area,
              "        const QString threadId = root_id;        threadFollowButton = new ThemeIconButton(this);\n"
              "        threadFollowButton->setObjectName(QStringLiteral(\"threadFollowButton\"));\n"
              "        threadFollowButton->setFixedSize(HeaderActionIconExtent + 8,\n"
              "                               HeaderActionIconExtent + 8);\n"
              "        threadFollowButton->setIconSize(QSize(HeaderActionIconExtent,\n"
              "                                    HeaderActionIconExtent));\n"
              "        threadFollowButton->setProperty(ThemeIconResourceProperty,\n"
              "                              QStringLiteral(\":/icons/bell\"));\n"
              "threadFollowButton->setEnabled(false);\n",
              "        const QString threadId = root_id;\n"
              "        threadFollowButton = new ThemeIconButton(this);\n"
              "        threadFollowButton->setObjectName(QStringLiteral(\"threadFollowButton\"));\n"
              "        threadFollowButton->setFixedSize(HeaderActionIconExtent + 8,\n"
              "                                         HeaderActionIconExtent + 8);\n"
              "        threadFollowButton->setIconSize(QSize(HeaderActionIconExtent,\n"
              "                                              HeaderActionIconExtent));\n"
              "        threadFollowButton->setProperty(ThemeIconResourceProperty,\n"
              "                                        QStringLiteral(\":/icons/bell\"));\n"
              "        threadFollowButton->setEnabled(false);\n",
          )
          replace_once(chat_area, "    }    if (threadFollowButton) {\n", "    }\n    if (threadFollowButton) {\n")
          replace_once(
              chat_area,
              "        threadFollowButton->setProperty(\n"
              "  ThemeIconResourceProperty,\n"
              "  following ? QStringLiteral(\":/icons/bell-filled\")\n"
              "            : QStringLiteral(\":/icons/bell\"));\n",
              "        threadFollowButton->setProperty(\n"
              "            ThemeIconResourceProperty,\n"
              "            following ? QStringLiteral(\":/icons/bell-filled\")\n"
              "                      : QStringLiteral(\":/icons/bell\"));\n",
          )

          formatter = Path("sources/chat-area/post/MessageFormatter.cpp")
          preserve_breaks = (
              "QString preserveUserLineBreaks(const QString& text)\n"
              "{\n"
              "    QString result;\n"
              "    result.reserve(text.size() + text.count(QLatin1Char('\\n')) * 2);\n\n"
              "    int position = 0;\n"
              "    while (position < text.size()) {\n"
              "        const int fenceEnd = fencedBlockEnd(text, position);\n"
              "        if (fenceEnd != -1) {\n"
              "            result += text.mid(position, fenceEnd - position);\n"
              "            position = fenceEnd;\n"
              "            continue;\n"
              "        }\n\n"
              "        const int newline = text.indexOf(QLatin1Char('\\n'), position);\n"
              "        if (newline == -1) {\n"
              "            result += text.mid(position);\n"
              "            break;\n"
              "        }\n\n"
              "        result += text.mid(position, newline - position);\n\n"
              "        // A blank line already creates a Markdown block boundary, and a fenced\n"
              "        // block beginning on the next line is also a hard structural boundary.\n"
              "        // Only ordinary soft line breaks need CommonMark's two-space marker.\n"
              "        const bool blankBoundary = newline + 1 < text.size()\n"
              "            && text.at(newline + 1) == QLatin1Char('\\n');\n"
              "        const bool beforeFence = newline + 1 < text.size()\n"
              "            && fencedBlockEnd(text, newline + 1) != -1;\n"
              "        if (!blankBoundary && !beforeFence && newline + 1 < text.size()) {\n"
              "            int trailingSpaces = 0;\n"
              "            for (int i = result.size() - 1;\n"
              "                 i >= 0 && result.at(i) == QLatin1Char(' '); --i) {\n"
              "                ++trailingSpaces;\n"
              "            }\n"
              "            while (trailingSpaces++ < 2) {\n"
              "                result += QLatin1Char(' ');\n"
              "            }\n"
              "        }\n\n"
              "        result += QLatin1Char('\\n');\n"
              "        position = newline + 1;\n"
              "    }\n"
              "    return result;\n"
              "}\n\n"
          )
          replace_between(
              formatter,
              "QString preserveUserLineBreaks(const QString& text)\n",
              "QString promoteMultilineCodeSpans(const QString& text)\n",
              preserve_breaks,
          )
          PY

          git rm .github/workflows/zz-pr52-cleanup.yml
          git diff --check
          git diff

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/channel-tree/ChannelTree.cpp \
                  sources/backend/FollowingModel.cpp \
                  sources/backend/UserProfileService.cpp \
                  sources/chat-area/ChatArea.cpp \
                  sources/chat-area/post/MessageFormatter.cpp
          git commit -m "Finish unread reconciliation and clean PR 52"
          git push origin HEAD:fix/four-ui-data-regressions
