name: Temporary linuxdeploy hash probe

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-linuxdeploy-hash.yml'

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-24.04
    steps:
      - name: Download pinned versioned linuxdeploy tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage \
            -o linuxdeploy-x86_64.AppImage
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage \
            -o linuxdeploy-plugin-qt-x86_64.AppImage
          sha256sum linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
