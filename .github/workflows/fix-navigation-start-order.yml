name: Fix navigation start order

on:
  push:
    branches:
      - fix-stale-permalink-navigation
    paths:
      - tools/fix_navigation_start_order.py
      - .github/workflows/fix-navigation-start-order.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-stale-permalink-navigation
      - run: python3 tools/fix_navigation_start_order.py
      - name: Commit fix
        run: |
          rm tools/fix_navigation_start_order.py .github/workflows/fix-navigation-start-order.yml
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add -A
          git commit -m 'Connect navigation invalidation before publishing it'
          git push
