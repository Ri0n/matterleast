name: Run unread visual connection patch helper
on:
  push:
    branches:
      - fix/four-ui-data-regressions
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/four-ui-data-regressions
      - name: Apply patch
        run: python3 .github/scripts/patch_unread_connection_test.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -f
          git commit -m 'Keep sidebar unread visuals synchronized'
          git push
