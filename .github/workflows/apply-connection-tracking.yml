name: Apply connection tracking patch

on:
  push:
    branches:
      - connection-tracking-reconnect
    paths:
      - tools/apply_connection_tracking.py
      - .github/workflows/apply-connection-tracking.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: connection-tracking-reconnect
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/apply_connection_tracking.py
      - name: Commit implementation
        run: |
          git config user.name "Sergei Ilinykh"
          git config user.email "rion4ik@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Track realtime connection and accelerate reconnects"
          git push origin HEAD:connection-tracking-reconnect
