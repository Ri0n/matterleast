name: Fix sidebar optimistic DnD verification

on:
  push:
    branches:
      - feature/sidebar-optimistic-dnd
    paths:
      - .github/scripts/fix_sidebar_dnd_compile.py
      - .github/workflows/sidebar-dnd-ux-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sidebar-optimistic-dnd
      - name: Apply fixes
        run: python3 .github/scripts/fix_sidebar_dnd_compile.py
      - name: Remove temporary patch machinery
        run: |
          rm .github/scripts/fix_sidebar_dnd_compile.py
          rm .github/workflows/sidebar-dnd-ux-fix.yml
      - name: Commit implementation
        run: |
          git config user.name "Sergei Ilinykh"
          git config user.email "rion4ik@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix optimistic sidebar verification"
          git push
