name: Apply sidebar drag session structural freeze

on:
  push:
    branches: [feature/sidebar-optimistic-dnd]
    paths:
      - '.github/scripts/patch_sidebar_drag_session.py'
      - '.github/workflows/apply-sidebar-drag-session.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sidebar-optimistic-dnd
      - name: Apply drag session freeze patch
        run: python3 .github/scripts/patch_sidebar_drag_session.py
      - name: Remove temporary patch files
        run: rm .github/scripts/patch_sidebar_drag_session.py .github/workflows/apply-sidebar-drag-session.yml
      - name: Commit implementation
        run: |
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add -A
          git commit -m 'Freeze sidebar structure during drag'
          git push
