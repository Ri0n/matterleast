name: Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional MatterLeast version override (for example 1.0)
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: Optional MatterLeast version override (for example 1.0)
        required: false
        type: string

permissions:
  contents: read

env:
  QT_WINDOWS_VERSION: "6.11.2"
  QT_APPIMAGE_VERSION: "6.11.2"
  LINUXDEPLOY_ASSET_ID: "538917371"
  LINUXDEPLOY_SHA256: "36a2d7e274d12e1050d0e9ecfe11d339ed54720b2bec464c286d53f8b07f5c62"
  LINUXDEPLOY_QT_ASSET_ID: "525032210"
  LINUXDEPLOY_QT_SHA256: "cfc1055b2b9dbc08412b579f20990b7b41a17b61beaa5847dc9477c96c9e9617"

jobs:
  debian:
    name: Ubuntu ${{ matrix.ubuntu-version }} — DEB — Qt ${{ matrix.qt-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu-version: "22.04"
            runner: ubuntu-22.04
            qt-version: "5.15.3"
            qt6: "OFF"
            build-runtime-packages: "libqt5sql5-sqlite libqt5svg5"
            debian-extra-depends: "libqt5svg5"
          - ubuntu-version: "24.04"
            runner: ubuntu-24.04
            qt-version: "6.4.2"
            qt6: "ON"
            build-runtime-packages: "libqt6sql6-sqlite libqt6svg6"
            debian-extra-depends: "libqt6svg6"
          - ubuntu-version: "26.04"
            runner: ubuntu-26.04
            qt-version: "6.10.2"
            qt6: "ON"
            build-runtime-packages: "libqt6sql6-sqlite libqt6svg6 qt6-svg-plugins"
            debian-extra-depends: "libqt6svg6, qt6-svg-plugins"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          packages=(build-essential dpkg-dev fakeroot)
          if [[ "${{ matrix.qt6 }}" == "ON" ]]; then
            packages+=(qt6-base-dev qt6-websockets-dev)
          else
            packages+=(qtbase5-dev libqt5websockets5-dev)
          fi
          read -r -a runtime_packages <<< "${{ matrix.build-runtime-packages }}"
          packages+=("${runtime_packages[@]}")
          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_6=${{ matrix.qt6 }} \
            -DBUILD_TESTING=ON \
            -DWARNINGS_AS_ERRORS=ON \
            -DMATTERLEAST_VERSION="${{ inputs.version }}" \
            -DMATTERLEAST_DEBIAN_EXTRA_DEPENDS="${{ matrix.debian-extra-depends }}"

          version=$(tr -d '[:space:]' < build/matterleast-version.txt)
          test -n "$version"
          requested="${{ inputs.version }}"
          requested=${requested#v}
          if [[ -n "$requested" && "$version" != "$requested" ]]; then
            echo "::error::CMake resolved version '$version', expected '$requested'"
            exit 1
          fi

      - name: Build
        run: cmake --build build --parallel 4

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Build DEB
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cpack --config build/CPackConfig.cmake -G DEB -B package
          deb=$(find package -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$deb"

          version=$(tr -d '[:space:]' < build/matterleast-version.txt)
          package_version=$(dpkg-deb -f "$deb" Version)
          if [[ "$package_version" != "$version" ]]; then
            echo "::error::DEB version '$package_version' does not match MatterLeast version '$version'"
            exit 1
          fi

          depends=$(dpkg-deb -f "$deb" Depends)
          case "${{ matrix.ubuntu-version }}" in
            22.04) required_deps=(libqt5sql5-sqlite libqt5svg5) ;;
            24.04) required_deps=(libqt6sql6-sqlite libqt6svg6) ;;
            26.04) required_deps=(libqt6sql6-sqlite libqt6svg6 qt6-svg-plugins) ;;
            *) echo "::error::Unknown Ubuntu version"; exit 1 ;;
          esac
          for dep in "${required_deps[@]}"; do
            if [[ "$depends" != *"$dep"* ]]; then
              echo "::error::DEB dependency '$dep' is missing: $depends"
              exit 1
            fi
          done

          output="package/matterleast-${version}-ubuntu-${{ matrix.ubuntu-version }}-amd64.deb"
          mv "$deb" "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: matterleast-deb-ubuntu-${{ matrix.ubuntu-version }}-amd64
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          compression-level: 0

  appimage:
    name: Ubuntu 24.04 — AppImage — Qt 6.11.2
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install AppImage build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libgl1-mesa-dev \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            ninja-build \
            xauth \
            xvfb

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_APPIMAGE_VERSION }}
          # qtsvg and qtwayland are Qt archives in the desktop package, not
          # addon modules accepted by aqt's --modules switch. The default
          # archive set already installs them; only WebSockets is an addon here.
          modules: qtwebsockets
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
          cache: true

      - name: Verify AppImage Qt baseline
        shell: bash
        run: |
          set -euo pipefail
          qt_version=$(qmake -query QT_VERSION)
          if [[ "$qt_version" != "${{ env.QT_APPIMAGE_VERSION }}" ]]; then
            echo "::error::Expected Qt ${{ env.QT_APPIMAGE_VERSION }}, got $qt_version"
            exit 1
          fi
          echo "Qt $qt_version"
          ldd --version | head -n 1

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DQT_6=ON \
            -DBUILD_TESTING=ON \
            -DWARNINGS_AS_ERRORS=ON \
            -DMATTERLEAST_VERSION="${{ inputs.version }}"

          version=$(tr -d '[:space:]' < build/matterleast-version.txt)
          test -n "$version"
          requested="${{ inputs.version }}"
          requested=${requested#v}
          if [[ -n "$requested" && "$version" != "$requested" ]]; then
            echo "::error::CMake resolved version '$version', expected '$requested'"
            exit 1
          fi

      - name: Build
        run: cmake --build build --parallel 4

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Stage AppDir
        shell: bash
        run: |
          set -euo pipefail
          rm -rf AppDir
          DESTDIR="$PWD/AppDir" cmake --install build
          test -x AppDir/usr/bin/matterleast
          test -f AppDir/usr/share/applications/io.github.Ri0n.MatterLeast.desktop
          test -f AppDir/usr/share/icons/hicolor/scalable/apps/io.github.Ri0n.MatterLeast.svg

      - name: Fetch pinned linuxdeploy tools
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p appimage-tools
          api_headers=(
            -H "Accept: application/octet-stream"
            -H "Authorization: Bearer $GH_TOKEN"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          curl --fail --location --retry 3 "${api_headers[@]}" \
            "https://api.github.com/repos/linuxdeploy/linuxdeploy/releases/assets/${LINUXDEPLOY_ASSET_ID}" \
            -o appimage-tools/linuxdeploy-x86_64.AppImage
          curl --fail --location --retry 3 "${api_headers[@]}" \
            "https://api.github.com/repos/linuxdeploy/linuxdeploy-plugin-qt/releases/assets/${LINUXDEPLOY_QT_ASSET_ID}" \
            -o appimage-tools/linuxdeploy-plugin-qt-x86_64.AppImage

          echo "${LINUXDEPLOY_SHA256}  appimage-tools/linuxdeploy-x86_64.AppImage" | sha256sum -c -
          echo "${LINUXDEPLOY_QT_SHA256}  appimage-tools/linuxdeploy-plugin-qt-x86_64.AppImage" | sha256sum -c -
          chmod +x appimage-tools/*.AppImage

      - name: Build and smoke-test AppImage
        id: package
        shell: bash
        run: |
          set -euo pipefail

          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$(command -v qmake)"
          export EXTRA_QT_MODULES="svg"
          # Qt 6.11 consolidated the Wayland QPA plugin into libqwayland.so.
          # Older linuxdeploy-plugin-qt documentation still names the pre-6.11
          # libqwayland-{egl,generic}.so plugins.
          export EXTRA_PLATFORM_PLUGINS="libqwayland.so"

          # MatterLeast only requires the SQLite Qt SQL driver (the native
          # packages declare the same runtime dependency). Official Qt builds
          # also ship drivers for proprietary/external databases; linuxdeploy
          # otherwise tries to resolve all of them and fails on libraries such
          # as libmimerapi.so that are intentionally absent from the runner.
          qt_plugins="$(qmake -query QT_INSTALL_PLUGINS)"
          test -f "$qt_plugins/sqldrivers/libqsqlite.so"
          find "$qt_plugins/sqldrivers" -maxdepth 1 -type f \
            -name 'libqsql*.so' ! -name 'libqsqlite.so' -print -delete

          ./appimage-tools/linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage

          test -n "$(find AppDir -name 'libQt6Core.so.6' -print -quit)"
          test -n "$(find AppDir -name 'libqxcb.so' -print -quit)"
          test -n "$(find AppDir -name 'libqwayland.so' -print -quit)"
          test -n "$(find AppDir -name 'libqsqlite.so' -print -quit)"
          test -n "$(find AppDir -name 'libqsvg.so' -print -quit)"

          image=$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$image"
          chmod +x "$image"

          # linuxdeploy itself is an AppImage and is run in extract mode so
          # packaging does not depend on the CI host's FUSE setup. Test the
          # produced MatterLeast AppImage normally, without that escape hatch.
          unset APPIMAGE_EXTRACT_AND_RUN

          mkdir -p "$RUNNER_TEMP/matterleast-appimage-home"
          set +e
          timeout 8s xvfb-run -a env \
            -u LD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH \
            -u QML2_IMPORT_PATH \
            HOME="$RUNNER_TEMP/matterleast-appimage-home" \
            QT_QPA_PLATFORM=xcb \
            "$image" >appimage-smoke.log 2>&1
          smoke_status=$?
          set -e
          cat appimage-smoke.log
          if [[ "$smoke_status" -ne 124 ]]; then
            echo "::error::AppImage did not stay running on Ubuntu 24.04/XCB (status $smoke_status)"
            exit "$smoke_status"
          fi

          version=$(tr -d '[:space:]' < build/matterleast-version.txt)
          mkdir -p package
          output="package/matterleast-${version}-linux-x86_64.AppImage"
          mv "$image" "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: matterleast-appimage-linux-x86_64
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          compression-level: 0

  fedora:
    name: Fedora 44 — RPM — Qt 6.11.x
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: fedora:44

    steps:
      - name: Install build dependencies
        run: |
          dnf -y update
          dnf -y install \
            cmake \
            gcc-c++ \
            git \
            make \
            rpm-build \
            qt6-qtbase-devel \
            qt6-qtsvg \
            qt6-qtwebsockets-devel
          dnf clean all

      - name: Checkout
        uses: actions/checkout@v7

      - name: Report Qt version
        run: qmake6 -query QT_VERSION

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_6=ON \
            -DBUILD_TESTING=ON \
            -DWARNINGS_AS_ERRORS=ON \
            -DMATTERLEAST_VERSION="${{ inputs.version }}"

          version=$(tr -d '[:space:]' < build/matterleast-version.txt)
          test -n "$version"
          requested="${{ inputs.version }}"
          requested=${requested#v}
          if [[ -n "$requested" && "$version" != "$requested" ]]; then
            echo "::error::CMake resolved version '$version', expected '$requested'"
            exit 1
          fi

      - name: Build
        run: cmake --build build --parallel 4

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Build and verify RPM
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cpack --config build/CPackConfig.cmake -G RPM -B package
          rpm_file=$(find package -maxdepth 1 -type f -name '*.rpm' -print -quit)
          test -n "$rpm_file"

          version=$(tr -d '[:space:]' < build/matterleast-version.txt)
          package_version=$(rpm -qp --qf '%{VERSION}' "$rpm_file")
          if [[ "$package_version" != "$version" ]]; then
            echo "::error::RPM version '$package_version' does not match MatterLeast version '$version'"
            exit 1
          fi

          requires=$(rpm -qpR "$rpm_file")
          if ! grep -Fxq 'qt6-qtsvg' <<< "$requires"; then
            echo "::error::RPM dependency 'qt6-qtsvg' is missing"
            printf '%s\n' "$requires"
            exit 1
          fi

          dnf -y install "$rpm_file"
          rpm -q matterleast

          output="package/matterleast-${version}-fedora-44-x86_64.rpm"
          mv "$rpm_file" "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: matterleast-rpm-fedora-44-x86_64
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          compression-level: 0


  windows:
    name: Windows 2025 — NSIS — Qt 6.11.2
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_WINDOWS_VERSION }}
          modules: qtwebsockets
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path (Join-Path $nsisDir "makensis.exe"))) {
            throw "makensis.exe was not installed in $nsisDir"
          }
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DQT_6=ON `
            -DBUILD_TESTING=ON `
            -DWARNINGS_AS_ERRORS=ON `
            -DMATTERLEAST_VERSION="${{ inputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $version = (Get-Content build/matterleast-version.txt -Raw).Trim()
          if (-not $version) { throw "CMake did not resolve a MatterLeast version" }
          $requested = "${{ inputs.version }}".TrimStart('v')
          if ($requested -and $version -ne $requested) {
            throw "CMake resolved version '$version', expected '$requested'"
          }

      - name: Build
        run: |
          cmake --build build --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Unit tests
        run: |
          ctest --test-dir build --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows executable metadata
        run: |
          $exe = Get-Item build/matterleast.exe
          $info = $exe.VersionInfo
          $version = (Get-Content build/matterleast-version.txt -Raw).Trim()
          $expected = @{
            ProductName = "MatterLeast"
            FileDescription = "Native Qt client for Mattermost"
            CompanyName = "MatterLeast contributors"
            OriginalFilename = "matterleast.exe"
            FileVersion = $version
            ProductVersion = $version
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $actual = $info.($entry.Key)
            if ($actual -ne $entry.Value) {
              throw "matterleast.exe $($entry.Key)='$actual', expected '$($entry.Value)'"
            }
          }
          $info | Format-List ProductName,FileDescription,CompanyName,FileVersion,ProductVersion,OriginalFilename

      - name: Verify deployed runtime
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "stage"
          cmake --install build --prefix "$stage"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $required = @(
            (Join-Path $stage "bin/matterleast.exe"),
            (Join-Path $stage "bin/Qt6Core.dll"),
            (Join-Path $stage "bin/Qt6Widgets.dll"),
            (Join-Path $stage "bin/Qt6Network.dll"),
            (Join-Path $stage "bin/Qt6WebSockets.dll"),
            (Join-Path $stage "plugins/platforms/qwindows.dll")
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Qt deployment is incomplete: missing $path"
            }
          }

      - name: Build NSIS installer
        id: package
        run: |
          cpack --config build/CPackConfig.cmake -G NSIS -B package
          $cpackExit = $LASTEXITCODE
          if ($cpackExit -ne 0) {
            $log = Get-ChildItem package -Recurse -File -Filter "NSISOutput.log" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($log) {
              Write-Host "==== $($log.FullName) ===="
              Get-Content -LiteralPath $log.FullName
            } else {
              Write-Host "NSISOutput.log was not produced"
            }
            exit $cpackExit
          }

          $installer = Get-ChildItem package -File -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "CPack did not produce an NSIS installer"
          }

          $version = (Get-Content build/matterleast-version.txt -Raw).Trim()
          $installerInfo = $installer.VersionInfo
          if (-not $installerInfo.ProductName -or -not $installerInfo.FileVersion) {
            throw "NSIS installer is missing Windows version metadata"
          }
          $installerInfo | Format-List ProductName,FileDescription,CompanyName,FileVersion,ProductVersion

          $output = Join-Path $installer.DirectoryName "matterleast-$version-windows-x64-installer.exe"
          Move-Item -LiteralPath $installer.FullName -Destination $output
          "path=$output" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: matterleast-windows-x64-installer
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          compression-level: 0
