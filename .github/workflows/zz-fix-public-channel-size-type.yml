name: Apply public channel size type fix

on:
  push:
    branches:
      - fix/four-ui-data-regressions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/four-ui-data-regressions
          fetch-depth: 0

      - name: Fix Qt6 qsizetype mismatch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('sources/channel-tree-dialogs/TeamChannelsListDialog.cpp')
          text = path.read_text()
          old = 'const int last = std::min(first + PublicChannelsPerPage, pageChannels.size()) - 1;'
          new = ('const int last = std::min(first + PublicChannelsPerPage,\n'
                 '                                  static_cast<int>(pageChannels.size())) - 1;')
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one size mismatch site, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          git rm .github/workflows/zz-fix-public-channel-size-type.yml
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/channel-tree-dialogs/TeamChannelsListDialog.cpp
          git commit -m "Fix Qt6 public channel paging size type"
          git push origin HEAD:fix/four-ui-data-regressions
