name: Fix sidebar DnD geometry transition

on:
  push:
    branches:
      - feature/sidebar-optimistic-dnd

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sidebar-optimistic-dnd
      - name: Apply geometry fix
        run: python .github/scripts/fix_sidebar_dnd_geometry.py
      - name: Remove temporary patch files
        run: git rm .github/workflows/fix-sidebar-dnd-geometry-transition.yml .github/scripts/fix_sidebar_dnd_geometry.py
      - name: Commit implementation
        run: |
          git config user.name "Sergei Ilinykh"
          git config user.email "rion4ik@gmail.com"
          git add sources/channel-tree/ChannelTree.h sources/channel-tree/ChannelTreeDragVisuals.cpp
          git diff --cached --check
          git commit -m "Keep sidebar drag geometry extent constant"
          git push origin HEAD:feature/sidebar-optimistic-dnd
