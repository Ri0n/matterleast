name: Apply palette rebuild crash fix

on:
  push:
    branches:
      - fix/four-ui-data-regressions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/four-ui-data-regressions
          fetch-depth: 0

      - name: Apply fix and regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              path.write_text(text.replace(old, new, 1))

          header = Path("sources/chat-area/post/MessageContentWidget.h")
          replace_once(header, "class QVBoxLayout;\n", "class QEvent;\nclass QVBoxLayout;\n")
          replace_once(
              header,
              "signals:\n    void linkHovered(const QString& link);\n    void dimensionsChanged();\n\nprivate:\n",
              "signals:\n    void linkHovered(const QString& link);\n    void dimensionsChanged();\n    void paletteRefreshCompleted();\n\nprotected:\n    void changeEvent(QEvent* event) override;\n\nprivate:\n",
          )
          replace_once(
              header,
              "    bool dimensionsChangePending = false;\n    QString _sourceMessage;\n",
              "    bool dimensionsChangePending = false;\n    bool paletteRefreshPending = false;\n    QString _sourceMessage;\n",
          )

          content = Path("sources/chat-area/post/MessageContentWidget.cpp")
          marker = "}\n\nvoid MessageContentWidget::setMessage(const QString& message)\n"
          insertion = (
              "}\n\n"
              "void MessageContentWidget::changeEvent(QEvent* event)\n"
              "{\n"
              "    QWidget::changeEvent(event);\n"
              "    if (!event || (event->type() != QEvent::PaletteChange\n"
              "                   && event->type() != QEvent::ApplicationPaletteChange)\n"
              "        || paletteRefreshPending || _sourceMessage.isEmpty()) {\n"
              "        return;\n"
              "    }\n\n"
              "    // Rebuilding the QTextBrowser/QPlainTextEdit children synchronously from a\n"
              "    // PaletteChange handler invalidates QWidgetPrivate's palette-propagation\n"
              "    // traversal. Defer and coalesce the rebuild until that traversal has\n"
              "    // completed; the context object also cancels the callback on destruction.\n"
              "    paletteRefreshPending = true;\n"
              "    QTimer::singleShot(0, this, [this] {\n"
              "        paletteRefreshPending = false;\n"
              "        if (_sourceMessage.isEmpty()) {\n"
              "            return;\n"
              "        }\n\n"
              "        const QString sourceMessage = _sourceMessage;\n"
              "        setMessage(sourceMessage);\n"
              "        emit paletteRefreshCompleted();\n"
              "    });\n"
              "}\n\n"
              "void MessageContentWidget::setMessage(const QString& message)\n"
          )
          replace_once(content, marker, insertion)

          post = Path("sources/chat-area/post/PostWidget.cpp")
          replace_once(
              post,
              "\tconnect(messageContent, &MessageContentWidget::dimensionsChanged,\n"
              "\t        this, &PostWidget::dimensionsChanged);\n"
              "\tmessageContent->setMessage(displayMessage(post, post.message));\n",
              "\tconnect(messageContent, &MessageContentWidget::dimensionsChanged,\n"
              "\t        this, &PostWidget::dimensionsChanged);\n"
              "\tconnect(messageContent, &MessageContentWidget::paletteRefreshCompleted,\n"
              "\t        this, &PostWidget::connectMessageLinks);\n"
              "\tmessageContent->setMessage(displayMessage(post, post.message));\n",
          )
          replace_once(
              post,
              "    updateAuthorAvatar();\n    refreshMentionLinks();\n    update();\n",
              "    updateAuthorAvatar();\n    update();\n",
          )

          test = Path("tests/MessageContentWidgetTest.cpp")
          replace_once(
              test,
              "#include <QImage>\n#include <QPlainTextEdit>\n",
              "#include <QImage>\n#include <QPalette>\n#include <QPlainTextEdit>\n#include <QPointer>\n",
          )
          test_marker = "    void inlineUnicodeEmojiUsesLargerFont()\n"
          test_method = (
              "    void paletteChangeDefersContentRebuild()\n"
              "    {\n"
              "        MessageContentWidget widget;\n"
              "        widget.setMessage(QStringLiteral(\"theme-sensitive text\"));\n"
              "        showAndSettle(widget);\n\n"
              "        QSignalSpy refreshSpy(&widget, &MessageContentWidget::paletteRefreshCompleted);\n"
              "        auto* originalBrowser =\n"
              "            widget.findChild<QTextBrowser*>(QStringLiteral(\"messageRichText\"));\n"
              "        QVERIFY(originalBrowser != nullptr);\n"
              "        QPointer<QTextBrowser> originalBrowserGuard(originalBrowser);\n\n"
              "        QPalette firstPalette = widget.palette();\n"
              "        firstPalette.setColor(QPalette::Text, Qt::red);\n"
              "        widget.setPalette(firstPalette);\n"
              "        QPalette secondPalette = firstPalette;\n"
              "        secondPalette.setColor(QPalette::Text, Qt::blue);\n"
              "        widget.setPalette(secondPalette);\n\n"
              "        QVERIFY2(!originalBrowserGuard.isNull(),\n"
              "                 \"Palette propagation must not synchronously destroy message children\");\n"
              "        QCOMPARE(refreshSpy.count(), 0);\n\n"
              "        QTRY_COMPARE(refreshSpy.count(), 1);\n"
              "        QVERIFY2(originalBrowserGuard.isNull(),\n"
              "                 \"The deferred refresh should replace the old text widget afterwards\");\n"
              "        auto* rebuiltBrowser =\n"
              "            widget.findChild<QTextBrowser*>(QStringLiteral(\"messageRichText\"));\n"
              "        QVERIFY(rebuiltBrowser != nullptr);\n"
              "        QCOMPARE(rebuiltBrowser->toPlainText(), QStringLiteral(\"theme-sensitive text\"));\n"
              "    }\n\n"
          )
          replace_once(test, test_marker, test_method + test_marker)
          PY

          git rm .github/workflows/zz-fix-theme-palette-rebuild.yml
          git diff --check
          git diff

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/chat-area/post/MessageContentWidget.h \
                  sources/chat-area/post/MessageContentWidget.cpp \
                  sources/chat-area/post/PostWidget.cpp \
                  tests/MessageContentWidgetTest.cpp
          git commit -m "Fix crash while propagating palette changes"
          git push origin HEAD:fix/four-ui-data-regressions
