name: Apply initial sidebar DnD gap fix

on:
  push:
    branches:
      - feature/sidebar-optimistic-dnd

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sidebar-optimistic-dnd
      - name: Apply initial gap fix
        run: python3 .github/scripts/apply_sidebar_dnd_initial_gap_fix.py
      - name: Remove temporary patch files
        run: |
          rm .github/scripts/apply_sidebar_dnd_initial_gap_fix.py
          rm .github/workflows/apply-sidebar-dnd-initial-gap.yml
      - name: Commit implementation
        run: |
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Keep initial sidebar drag geometry stable'
          git push origin HEAD:feature/sidebar-optimistic-dnd
