name: Refine sidebar DnD placeholder

on:
  push:
    branches:
      - feature/sidebar-optimistic-dnd

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sidebar-optimistic-dnd
      - name: Apply placeholder and group-threshold fixes
        run: python3 .github/scripts/refine_sidebar_dnd_placeholder.py
      - name: Remove temporary patch machinery
        run: git rm .github/workflows/refine-sidebar-dnd-placeholder.yml .github/scripts/refine_sidebar_dnd_placeholder.py
      - name: Commit implementation
        run: |
          git config user.name "Sergei Ilinykh"
          git config user.email "rion4ik@gmail.com"
          git add sources/channel-tree/ChannelTree.h sources/channel-tree/ChannelTree.cpp sources/channel-tree/ChannelTreeDragVisuals.cpp
          git diff --cached --check
          git commit -m "Refine sidebar drag placeholder geometry"
          git push origin HEAD:feature/sidebar-optimistic-dnd
