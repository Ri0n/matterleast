name: Finalize sidebar optimistic DnD UX

on:
  push:
    branches:
      - feature/sidebar-optimistic-dnd
    paths:
      - .github/scripts/finalize_sidebar_dnd_ux.py
      - .github/workflows/sidebar-dnd-ux-finalize.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sidebar-optimistic-dnd
      - name: Apply hardening
        run: python3 .github/scripts/finalize_sidebar_dnd_ux.py
      - name: Remove temporary patch machinery
        run: |
          rm .github/scripts/finalize_sidebar_dnd_ux.py
          rm .github/workflows/sidebar-dnd-ux-finalize.yml
      - name: Commit implementation
        run: |
          git config user.name "Sergei Ilinykh"
          git config user.email "rion4ik@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden optimistic sidebar reconciliation"
          git push
