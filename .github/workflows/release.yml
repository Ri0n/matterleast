name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      replace_existing:
        description: Explicitly replace assets in an already-published release after a moved tag
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: matterleast-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Validate release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Unsupported release tag '$tag'. Expected vMAJOR.MINOR or vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v7

      - name: Prepare version
        id: version
        uses: ./.github/actions/prepare-version
        with:
          version: ${{ steps.tag.outputs.tag }}

  packages:
    name: Build release packages
    needs: version
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: Publish GitHub release
    needs: [version, packages]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7

      - name: Prepare version
        uses: ./.github/actions/prepare-version
        with:
          version: ${{ needs.version.outputs.version }}

      - name: Create source archive
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          archive="matterleast-$VERSION-source.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          tar \
            --exclude=.git \
            --transform "s,^,matterleast-$VERSION/," \
            -czf "$archive_path" .
          mkdir -p release-assets
          mv "$archive_path" release-assets/

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: matterleast-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            "matterleast-${VERSION}-ubuntu-22.04-amd64.deb"
            "matterleast-${VERSION}-ubuntu-22.04-amd64-dbgsym.deb"
            "matterleast-${VERSION}-ubuntu-24.04-amd64.deb"
            "matterleast-${VERSION}-ubuntu-24.04-amd64-dbgsym.deb"
            "matterleast-${VERSION}-ubuntu-26.04-amd64.deb"
            "matterleast-${VERSION}-ubuntu-26.04-amd64-dbgsym.deb"
            "matterleast-${VERSION}-debian-13-amd64.deb"
            "matterleast-${VERSION}-debian-13-amd64-dbgsym.deb"
            "matterleast-${VERSION}-fedora-44-x86_64.rpm"
            "matterleast-${VERSION}-linux-x86_64.AppImage"
            "matterleast-${VERSION}-windows-x64-installer.exe"
            "matterleast-${VERSION}-windows-x64-portable.zip"
            "matterleast-${VERSION}-source.tar.gz"
          )
          for asset in "${expected[@]}"; do
            test -f "release-assets/$asset" || {
              echo "::error::Missing release asset: $asset"
              exit 1
            }
          done
          count=$(find release-assets -maxdepth 1 -type f | wc -l)
          if [[ "$count" -ne "${#expected[@]}" ]]; then
            echo "::error::Expected ${#expected[@]} release assets, found $count"
            find release-assets -maxdepth 1 -type f -printf '%f\n'
            exit 1
          fi
          ls -lh release-assets

      - name: Create or replace GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          REPLACE_EXISTING: ${{ inputs.replace_existing || 'false' }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$REPLACE_EXISTING" != "true" ]]; then
              echo "::error::$TAG is already published. Explicit replace_existing=true is required to overwrite it."
              exit 1
            fi

            # Release assets are not tag-relative. A forced tag move alone
            # leaves the old binary packages and stale checksums in place.
            # Replace the complete, previously verified asset set; only then
            # let the update-channel job publish its new SHA-256 manifest.
            gh release upload "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --clobber

            # Regenerate notes against the moved tag so the follow-up fixes
            # appear in the same release rather than retaining old notes.
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
              --jq '.body' > "$RUNNER_TEMP/release-notes.md"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "MatterLeast $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "MatterLeast $VERSION"
          fi

          # A successful upload must not leave outdated or extraneous assets
          # that could be mistaken for packages from the moved tag.
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > expected-assets.txt
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | sort > actual-assets.txt
          diff -u expected-assets.txt actual-assets.txt

  update_channel:
    name: Promote stable Windows update pointer
    needs: [version, release]
    permissions:
      contents: write
    uses: ./.github/workflows/update-channel.yml
    secrets:
      update_signing_private_key_pem: ${{ secrets.MATTERLEAST_UPDATE_SIGNING_PRIVATE_KEY_PEM }}
    with:
      channel: stable
      release_tag: ${{ needs.version.outputs.tag }}
