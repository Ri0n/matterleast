name: Apply GM CRT read-state fix

on:
  push:
    branches:
      - fix/sidebar-dnd-followup
    paths:
      - .github/workflows/apply-gm-crt-read-policy.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sidebar-dnd-followup
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/apply-gm-crt-read-policy.py

      - name: Commit implementation
        run: |
          rm .github/scripts/apply-gm-crt-read-policy.py
          rm .github/workflows/apply-gm-crt-read-policy.yml
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add sources/backend/ChannelActivityTracker.h \
                  sources/backend/ChannelActivityTracker.cpp \
                  sources/backend/SidebarService.h \
                  sources/backend/SidebarService.cpp \
                  sources/backend/FollowingModel.cpp \
                  sources/chat-area/ChatLogWidget.cpp \
                  tests/ChannelActivityTrackerTest.cpp \
                  docs/following-attention-read-tracking.md
          git add -u .github
          git diff --cached --check
          git commit -m 'Align DM unread state with collapsed threads'
          git push origin HEAD:fix/sidebar-dnd-followup
