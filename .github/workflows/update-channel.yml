name: Publish stable Windows update channel

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      allow_rollback:
        type: boolean
        required: false
        default: false
    secrets:
      update_signing_private_key_pem:
        required: false
  workflow_dispatch:
    inputs:
      channel:
        required: true
        type: choice
        options: [stable]
      release_tag:
        description: Immutable stable GitHub Release tag
        required: true
        type: string
      allow_rollback:
        description: Explicitly permit emergency channel rollback
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: matterleast-update-pointer-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@v7

      - name: Validate immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            stable)
              [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || exit 1
              expect_prerelease=false
              ;;
            *) echo "::error::Only stable channel is supported here; nightly is published by nightly.yml"; exit 1;;
          esac
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease > release.json
          jq -e --argjson prerelease "$expect_prerelease" \
            '.isDraft == false and .isPrerelease == $prerelease' release.json

      - name: Fetch current pointer for monotonic promotion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if gh release view "updates-$CHANNEL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p previous
            gh release download "updates-$CHANNEL" --repo "$GITHUB_REPOSITORY" \
              --pattern windows-x64.json --dir previous
          fi

      - name: Download and hash immutable release ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback }}
        run: |
          set -euo pipefail
          mkdir -p immutable
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'matterleast-*-windows-x64-portable.zip' --dir immutable
          mapfile -t assets < <(find immutable -maxdepth 1 -type f -name '*.zip')
          [[ "${#assets[@]}" -eq 1 ]] || {
            echo "::error::Expected exactly one portable Windows release asset."
            exit 1
          }
          previous=()
          [[ ! -f previous/windows-x64.json ]] || previous+=(--previous previous/windows-x64.json)
          [[ "$ALLOW_ROLLBACK" != "true" ]] || previous+=(--allow-rollback)
          python3 scripts/make-windows-update-manifest.py \
            --channel "$CHANNEL" --release-tag "$RELEASE_TAG" \
            --asset "${assets[0]}" --output windows-x64.json "${previous[@]}"
          python3 -m unittest discover -s tests -p test_windows_update_manifest.py -v
          cat windows-x64.json

      # Optional corporate feed signing: a CI secret supplies the RSA private
      # key, which is never checked out or installed in the application.
      - name: Sign update manifest when release key is configured
        shell: bash
        env:
          UPDATE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.update_signing_private_key_pem || secrets.MATTERLEAST_UPDATE_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          if [[ -n "${UPDATE_SIGNING_PRIVATE_KEY_PEM:-}" ]]; then
            umask 077
            printf '%s\n' "$UPDATE_SIGNING_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/matterleast-update-sign.pem"
            trap 'rm -f "$RUNNER_TEMP/matterleast-update-sign.pem"' EXIT
            bash scripts/sign-update-manifest.sh windows-x64.json "$RUNNER_TEMP/matterleast-update-sign.pem"
          fi

      - name: Promote manifest-only channel release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          pointer="updates-$CHANNEL"
          if ! gh release view "$pointer" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$pointer" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Windows update pointer: $CHANNEL" \
              --notes "Manifest only. Download packages from immutable versioned releases."
          fi
          # Never silently downgrade an already signed feed to unsigned.
          if [[ ! -f windows-x64.json.sig ]] &&
             gh release view "$pointer" --repo "$GITHUB_REPOSITORY" \
               --json assets --jq '.assets[].name' | grep -Fxq windows-x64.json.sig; then
            echo "::error::Signed update channel requires the signing secret"
            exit 1
          fi
          # Publish the signature first, the manifest last. During rotation
          # transient mismatches fail closed for clients requiring signatures.
          if [[ -f windows-x64.json.sig ]]; then
            gh release upload "$pointer" windows-x64.json.sig \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi
          gh release upload "$pointer" windows-x64.json \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$pointer" --repo "$GITHUB_REPOSITORY" --json assets |
            jq -e '([.assets[].name] | sort) as $names |
              ($names == ["windows-x64.json"] or
               $names == ["windows-x64.json","windows-x64.json.sig"])'
          # Compare actual published sidecars with the just-verified source.
          # A GitHub asset redirect can briefly return 404 after replacement.
          mkdir -p verify-pointer
          for attempt in 1 2 3; do
            if gh release download "$pointer" --repo "$GITHUB_REPOSITORY" \
                --pattern 'windows-x64.json*' --dir verify-pointer --clobber; then
              break
            fi
            sleep 3
          done
          cmp windows-x64.json verify-pointer/windows-x64.json
          if [[ -f windows-x64.json.sig ]]; then
            cmp windows-x64.json.sig verify-pointer/windows-x64.json.sig
          fi
