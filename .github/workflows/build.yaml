name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-lock:
    name: QCA and QtKeychain dependency lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate pinned dependency sources
        run: python3 -m unittest discover -s tests -p test_dependency_lock.py -v

  update-manifest:
    name: Windows update manifest contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify stable/nightly JSON generation
        run: |
          python3 -m unittest discover -s tests -p test_windows_update_manifest.py -v
          python3 -m unittest discover -s tests -p test_prune_nightly_assets.py -v

  debian13:
    name: Qt 6.8.2 / Debian 13 — DEB
    runs-on: ubuntu-24.04
    container:
      # Match the release packaging workflow. ECR Public can reject anonymous
      # pulls with "toomanyrequests: Data limit exceeded" before CI starts.
      image: debian:13
    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates cmake ninja-build build-essential dpkg-dev fakeroot file \
            qt6-base-dev qt6-websockets-dev libqt6sql6-sqlite libqt6svg6 qt6-svg-plugins libssl-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare version
        uses: ./.github/actions/prepare-version
        with:
          version: ""

      - name: Build, test and package
        shell: bash
        run: |
          set -euo pipefail
          test "$(qmake6 -query QT_VERSION)" = 6.8.2
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DQT_6=ON -DBUILD_TESTING=ON \
            -DMATTERLEAST_BUNDLED_QCA=ON -DWARNINGS_AS_ERRORS=ON \
            "-DMATTERLEAST_DEBIAN_EXTRA_DEPENDS=libqt6svg6, qt6-svg-plugins"
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
          cpack --config build/CPackConfig.cmake -G DEB -B package
          version=$(tr -d '[:space:]' < build/matterleast-version.txt)
          deb=$(find package -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Version)" = "$version"
          runtime="package/matterleast-${version}-debian-13-amd64.deb"
          symbols="package/matterleast-${version}-debian-13-amd64-dbgsym.deb"
          mv "$deb" "$runtime"
          bash scripts/package-deb-debug.sh "$runtime" "$symbols"
          test "$(dpkg-deb -f "$symbols" Package)" = matterleast-dbgsym
          test "$(dpkg-deb -f "$symbols" Version)" = "$version"
          test "$(dpkg-deb -f "$symbols" Depends)" = "matterleast (= $version)"
          dpkg-deb --contents "$symbols" | grep -F '/usr/lib/debug/usr/bin/matterleast.debug'

      - name: Upload Debian 13 test package
        uses: actions/upload-artifact@v4
        with:
          name: matterleast-debian-13-amd64
          path: |
            package/matterleast-*-debian-13-amd64.deb
            package/matterleast-*-debian-13-amd64-dbgsym.deb
          if-no-files-found: error

  ubuntu-2404:
    name: Qt 6.4.2 + Multimedia / Ubuntu 24.04
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare version
        uses: ./.github/actions/prepare-version
        with:
          version: ""

      - name: Install system Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libqt6sql6-sqlite \
            libqt6svg6 \
            qt6-base-dev \
            qt6-multimedia-dev \
            qt6-websockets-dev \
            qtkeychain-qt6-dev \
            libssl-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DQT_6=ON
          -DBUILD_MULTIMEDIA=ON
          -DBUILD_TESTING=ON
          -DMATTERLEAST_BUNDLED_QCA=ON -DWARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  ubuntu-2204:
    name: Qt 5.15.3 / Ubuntu 22.04
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare version
        uses: ./.github/actions/prepare-version
        with:
          version: ""

      - name: Install system Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libqt5sql5-sqlite \
            libqt5websockets5-dev \
            qtbase5-dev \
            qtkeychain-qt5-dev \
            libssl-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DQT_6=OFF
          -DBUILD_TESTING=ON
          -DMATTERLEAST_BUNDLED_QCA=ON -DWARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Qt 6.11.2 / Windows 2025
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare version
        uses: ./.github/actions/prepare-version
        with:
          version: ""

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          modules: 'qtwebsockets'
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: windows-msvc-qt6.11.2
          max-size: 2G

      - name: Configure
        env:
          CCACHE_COMPILERCHECK: content
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DQT_6=ON
          -DMATTERLEAST_USE_KEYCHAIN=ON
          -DBUILD_TESTING=ON
          -DMATTERLEAST_BUNDLED_QCA=ON -DWARNINGS_AS_ERRORS=ON

      - name: Build
        env:
          CCACHE_COMPILERCHECK: content
        run: cmake --build build --parallel 4

      - name: Thread tabs integration test (captured first run)
        shell: pwsh
        run: |
          # The Windows GUI-subsystem test binary does not write QtTest's
          # console output through CTest. Capture the FIRST execution, not a
          # repeat which can hide a first-run startup race.
          $log = Join-Path $PWD 'thread-tabs-first-run.txt'
          & ./build/tests/thread-tabs-integration-test.exe -o "$log,txt"
          $testExit = $LASTEXITCODE
          if (Test-Path $log) {
            Get-Content $log
          } else {
            Write-Error "QtTest did not produce its diagnostic log."
            exit 1
          }
          exit $testExit

      - name: Login bootstrap regression (captured first run)
        shell: pwsh
        run: |
          # QtTest's GUI-mode executable produces no useful stdout on Windows.
          # Capture the original execution, including assertion location.
          $log = Join-Path $PWD 'login-bootstrap-first-run.txt'
          & ./build/tests/login-bootstrap-test.exe -o "$log,txt"
          $testExit = $LASTEXITCODE
          if (Test-Path $log) {
            Get-Content $log
          } else {
            Write-Error "QtTest did not produce its login bootstrap log."
            exit 1
          }
          exit $testExit

      - name: Unit tests
        # Both GUI test binaries were run above with durable first-run output.
        run: ctest --test-dir build --verbose --output-on-failure -E "^(thread-tabs-integration-test|login-bootstrap-test)$"

      - name: Build portable Windows ZIP for PR testing
        shell: pwsh
        run: |
          cmake --install build --prefix stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path stage/bin/matterleast.exe)) {
            throw "Qt deploy tree is missing matterleast.exe"
          }
          $version = (Get-Content build/matterleast-version.txt -Raw).Trim()
          New-Item -ItemType Directory -Force package | Out-Null
          Compress-Archive -Path stage -DestinationPath "package/matterleast-$version-windows-x64-portable.zip"
          if (-not (Test-Path "package/matterleast-$version-windows-x64-portable.zip")) {
            throw "Portable archive not created"
          }

      - name: Upload portable ZIP for PR testing
        uses: actions/upload-artifact@v4
        with:
          name: matterleast-windows-x64-portable
          path: package/matterleast-*-windows-x64-portable.zip
          if-no-files-found: error

  signed-plugins:
    name: Ed25519 plugin signature contract / Qt6
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare version
        uses: ./.github/actions/prepare-version
        with:
          version: ""
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build qt6-base-dev \
            qt6-websockets-dev libssl-dev openssl
      - name: Configure ephemeral corporate signing policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/matterleast-signing"
          openssl genpkey -algorithm Ed25519 \
            -out "$RUNNER_TEMP/matterleast-signing/private.pem"
          openssl pkey -in "$RUNNER_TEMP/matterleast-signing/private.pem" \
            -pubout -out "$RUNNER_TEMP/matterleast-signing/public.pem"
          cmake -S . -B build-trusted -G Ninja -DQT_6=ON \
            -DMATTERLEAST_USE_KEYCHAIN=OFF \
            -DBUILD_TESTING=ON -DMATTERLEAST_BUNDLED_QCA=ON -DWARNINGS_AS_ERRORS=ON \
            -DMATTERLEAST_PLUGIN_VERIFY_KEY_FILE="$RUNNER_TEMP/matterleast-signing/public.pem" \
            -DMATTERLEAST_PLUGIN_SIGNING_KEY_FILE="$RUNNER_TEMP/matterleast-signing/private.pem"
      - name: Verify signed and tampered plugins
        run: |
          cmake --build build-trusted --target trusted-plugin-load-test --parallel 4
          ctest --test-dir build-trusted -R '^trusted-plugin-load-test$' --output-on-failure
