name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-lock:
    name: QCA and QtKeychain dependency lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate pinned dependency sources
        run: |
          python3 -m unittest discover -s tests -p test_dependency_lock.py -v
          python3 -m unittest discover -s tests -p test_qca_system_selection.py -v
          python3 -m unittest discover -s tests -p test_nsis_install_policy.py -v

  update-manifest:
    name: Windows update manifest contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify stable/nightly JSON generation
        run: |
          python3 -m unittest discover -s tests -p test_windows_update_manifest.py -v
          python3 -m unittest discover -s tests -p test_prune_nightly_assets.py -v
          python3 -m unittest discover -s tests -p test_update_policy.py -v
          python3 -m unittest discover -s tests -p test_windows_install_identity.py -v

  debian13:
    name: Qt 6.8.2 / Debian 13 — DEB
    runs-on: ubuntu-24.04
    container:
      # Match the release packaging workflow. ECR Public can reject anonymous
      # pulls with "toomanyrequests: Data limit exceeded" before CI starts.
      image: debian:13
    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates cmake ninja-build build-essential dpkg-dev fakeroot file \
            qt6-base-dev qt6-websockets-dev libqt6sql6-sqlite libqt6svg6 qt6-svg-plugins libssl-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare version
        uses: ./.github/actions/prepare-version
        with:
          version: ""

      - name: Build, test and package
        shell: bash
        run: |
          set -euo pipefail
          test "$(qmake6 -query QT_VERSION)" = 6.8.2
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DQT_6=ON -DBUILD_TESTING=ON \
            -DMATTERLEAST_BUNDLED_QCA=ON -DWARNINGS_AS_ERRORS=ON \
            "-DMATTERLEAST_DEBIAN_EXTRA_DEPENDS=libqt6svg6, qt6-svg-plugins"
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
          cpack --config build/CPackConfig.cmake -G DEB -B package
          version=$(tr -d '[:space:]' < build/matterleast-version.txt)
          deb=$(find package -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Version)" = "$version"
          runtime="package/matterleast-${version}-debian-13-amd64.deb"
          symbols="package/matterleast-${version}-debian-13-amd64-dbgsym.deb"
          mv "$deb" "$runtime"
          bash scripts/package-deb-debug.sh "$runtime" "$symbols"
          test "$(dpkg-deb -f "$symbols" Package)" = matterleast-dbgsym
          test "$(dpkg-deb -f "$symbols" Version)" = "$version"
          test "$(dpkg-deb -f "$symbols" Depends)" = "matterleast (= $version)"
          dpkg-deb --contents "$symbols" | grep -F '/usr/lib/debug/usr/bin/matterleast.debug'

      - name: Upload Debian 13 test package
        uses: actions/upload-artifact@v4
        with:
          name: matterleast-debian-13-amd64
          path: |
            package/matterleast-*-debian-13-amd64.deb
            package/matterleast-*-debian-13-amd64-dbgsym.deb
          if-no-files-found: error

  ubuntu-2404:
    name: Qt 6.4.2 + Multimedia / Ubuntu 24.04
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare version
        uses: ./.github/actions/prepare-version
        with:
          version: ""

      - name: Install system Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libqt6sql6-sqlite \
            libqt6svg6 \
            qt6-base-dev \
            qt6-multimedia-dev \
            qt6-websockets-dev \
            qtkeychain-qt6-dev \
            libqca-qt6-dev libqca-qt6-plugins

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DQT_6=ON
          -DBUILD_MULTIMEDIA=ON
          -DBUILD_TESTING=ON
          -DWARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  ubuntu-2204:
    name: Qt 5.15.3 / Ubuntu 22.04
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare version
        uses: ./.github/actions/prepare-version
        with:
          version: ""

      - name: Install system Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libqt5sql5-sqlite \
            libqt5websockets5-dev \
            qtbase5-dev \
            qtkeychain-qt5-dev \
            libqca-qt5-2-dev libqca-qt5-2-plugins

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DQT_6=OFF
          -DBUILD_TESTING=ON
          -DWARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Qt 6.11.2 / Windows 2025
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare version
        uses: ./.github/actions/prepare-version
        with:
          version: ""

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          modules: 'qtwebsockets'
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: windows-msvc-qt6.11.2
          max-size: 2G

      - name: Verify Windows NSIS template matches per-user policy
        shell: pwsh
        run: python -m unittest discover -s tests -p test_nsis_install_policy.py -v

      - name: Stamp Windows CI artifact build identity
        shell: pwsh
        run: |
          # CI artifacts are NOT published nightly releases. Their UTC
          # creation time distinguishes them from older nightly pointers.
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd-HHmmss')
          $id = "ci-$stamp-$($env:GITHUB_SHA.Substring(0,12))"
          "MATTERLEAST_CI_BUILD_ID=$id" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "CI build identity: $id"

      - name: Configure
        env:
          CCACHE_COMPILERCHECK: content
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DQT_6=ON
          -DMATTERLEAST_USE_KEYCHAIN=ON
          -DMATTERLEAST_INSTALL_ID="$env:MATTERLEAST_CI_BUILD_ID"
          -DBUILD_TESTING=ON
          -DMATTERLEAST_BUNDLED_QCA=ON -DWARNINGS_AS_ERRORS=ON

      - name: Build
        env:
          CCACHE_COMPILERCHECK: content
        run: cmake --build build --parallel 4

      - name: Thread tabs integration test (captured first run)
        shell: pwsh
        run: |
          # The Windows GUI-subsystem test binary does not write QtTest's
          # console output through CTest. Capture the FIRST execution, not a
          # repeat which can hide a first-run startup race.
          $log = Join-Path $PWD 'thread-tabs-first-run.txt'
          & ./build/tests/thread-tabs-integration-test.exe -o "$log,txt"
          $testExit = $LASTEXITCODE
          if (Test-Path $log) {
            Get-Content $log
          } else {
            Write-Error "QtTest did not produce its diagnostic log."
            exit 1
          }
          exit $testExit

      - name: Login bootstrap regression (captured first run)
        shell: pwsh
        run: |
          # QtTest's GUI-mode executable produces no useful stdout on Windows.
          # Capture the original execution, including assertion location.
          $log = Join-Path $PWD 'login-bootstrap-first-run.txt'
          & ./build/tests/login-bootstrap-test.exe -o "$log,txt"
          $testExit = $LASTEXITCODE
          if (Test-Path $log) {
            Get-Content $log
          } else {
            Write-Error "QtTest did not produce its login bootstrap log."
            exit 1
          }
          exit $testExit

      - name: Update controller regression (captured first run)
        shell: pwsh
        run: |
          $log = Join-Path $PWD 'windows-update-feedback-first-run.txt'
          & ./build/tests/windows-update-feedback-test.exe -o "$log,txt"
          $testExit = $LASTEXITCODE
          if (Test-Path $log) {
            Get-Content $log
          } else {
            Write-Error "QtTest did not produce an update feedback log."
            exit 1
          }
          exit $testExit

      - name: Unit tests
        # Capture QtTest assertion output from GUI-mode binaries explicitly.
        run: ctest --test-dir build --verbose --output-on-failure -E "^(thread-tabs-integration-test|login-bootstrap-test|windows-update-feedback-test)$"

      - name: Build portable Windows ZIP for PR testing
        shell: pwsh
        run: |
          cmake --install build --prefix stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content build/matterleast-version.txt -Raw).Trim()
          $installId = (Get-Content build/matterleast-install-id.txt -Raw).Trim()
          if ($installId -ne $env:MATTERLEAST_CI_BUILD_ID) {
            throw "CI package identity is not the compiled buildId"
          }
          $runtime = "stage/versions/$installId/MatterLeast"
          foreach ($p in @(
              "stage/MatterLeastLauncher.exe",
              "$runtime/bin/matterleast.exe",
              "$runtime/bin/MatterLeastUpdater.exe",
              "$runtime/bin/Qt6Core.dll",
              "$runtime/plugins/platforms/qwindows.dll")) {
            if (-not (Test-Path $p)) { throw "Versioned deployment missing $p" }
          }
          # Verify imported native OpenSSL libraries are present next to the
          # executable. GitHub runners have them on PATH; users generally don't.
          $exe = Join-Path $runtime "bin/matterleast.exe"
          $imports = & dumpbin.exe /DEPENDENTS "$exe" | Out-String
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed to inspect dependencies" }
          $opensslDlls = @([regex]::Matches($imports,
              '(?im)^\s*((?:libssl|libcrypto|libtls|ssleay|libeay)[\w.-]*\.dll)\s*$') |
              ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique)
          foreach ($name in $opensslDlls) {
            $dll = Join-Path $runtime "bin/$name"
            if (-not (Test-Path -LiteralPath $dll)) {
              throw "Required OpenSSL DLL absent from Windows package: $name"
            }
          }
          Write-Host "Packaged imported OpenSSL DLLs: $($opensslDlls -join ', ')"

          # The update ZIP contract requires exactly one MatterLeast/
          # root, not the CI-only stage/ name. Match packages.yml verbatim.
          $portable = Join-Path $env:RUNNER_TEMP "MatterLeast"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item (Join-Path (Resolve-Path stage) "*") $portable -Recurse -Force
          New-Item -ItemType Directory -Force package | Out-Null
          $zip = "package/matterleast-$version-windows-x64-portable.zip"
          Compress-Archive -Path $portable -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw "Portable archive not created" }
          # Catch incompatible directory layouts before publishing an artifact
          # that the updater's ZIP safety audit would necessarily reject.
          $contents = @(tar -tf $zip)
          if ($LASTEXITCODE -ne 0) { throw "Cannot enumerate ZIP contents" }
          foreach ($entry in @(
              "MatterLeast/MatterLeastLauncher.exe",
              "MatterLeast/versions/$installId/MatterLeast/bin/matterleast.exe",
              "MatterLeast/versions/$installId/MatterLeast/bin/MatterLeastUpdater.exe")) {
            if ($contents -notcontains $entry) {
              throw "Update ZIP is missing required entry $entry"
            }
          }
          if ($contents | Where-Object { $_ -notmatch '^MatterLeast/' }) {
            throw "Update ZIP must contain only paths below MatterLeast/"
          }

      - name: Package and inspect per-user NSIS installer on Windows
        shell: pwsh
        run: |
          $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
          $makensis = Join-Path $nsisDir "makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $makensis)) {
              throw "NSIS is unavailable for installer contract testing"
            }
          }
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$nsisDir;$env:PATH"
          cpack --config build/CPackConfig.cmake -G NSIS -B package
          if ($LASTEXITCODE -ne 0) { throw "NSIS packaging failed" }
          $nsi = Get-ChildItem package -Filter project.nsi -Recurse -File |
            Select-Object -First 1
          if (-not $nsi) { throw "Generated NSIS project.nsi not found" }
          $body = Get-Content -LiteralPath $nsi.FullName -Raw
          foreach ($line in @(
            'InstallDir "$LOCALAPPDATA\Programs\MatterLeast"',
            'RequestExecutionLevel user',
            'SetShellVarContext current')) {
            if (-not $body.Contains($line)) {
              throw "NSIS install script missing per-user contract: $line"
            }
          }
          if (-not ($body -match 'Section\s+/o\s+"Development"')) {
            throw "Development component must be unchecked by default in NSIS"
          }
          if ($body.Contains('StrCpy $INSTDIR "$DOCUMENTS') -or
              $body.Contains('SetShellVarContext all') -or
              $body.Contains('RequestExecutionLevel admin')) {
            throw "NSIS installer would use Documents, all-users shortcuts, or require elevation"
          }
          if (-not (Get-ChildItem package -File -Filter "*.exe" |
                Select-Object -First 1)) { throw "NSIS installer missing" }

      - name: Upload installer for PR testing
        uses: actions/upload-artifact@v4
        with:
          name: matterleast-windows-x64-installer-pr
          path: package/*.exe
          if-no-files-found: error

      - name: Upload portable ZIP for PR testing
        uses: actions/upload-artifact@v4
        with:
          name: matterleast-windows-x64-portable
          path: package/matterleast-*-windows-x64-portable.zip
          if-no-files-found: error

  signed-plugins:
    name: RSA/SHA256 signed plugins + updates / ${{ matrix.qca }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        qca: [system-qca2, bundled-qca3]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare version
        uses: ./.github/actions/prepare-version
        with:
          version: ""
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build qt6-base-dev \
            qt6-websockets-dev libqca-qt6-dev libqca-qt6-plugins libssl-dev openssl
      - name: Configure ephemeral corporate signing policy
        shell: bash
        env:
          QCA_BUNDLED: ${{ matrix.qca == 'bundled-qca3' && 'ON' || 'OFF' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/matterleast-signing"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
            -out "$RUNNER_TEMP/matterleast-signing/private.pem"
          openssl pkey -in "$RUNNER_TEMP/matterleast-signing/private.pem" \
            -pubout -out "$RUNNER_TEMP/matterleast-signing/public.pem"
          cmake -S . -B build-trusted -G Ninja -DQT_6=ON \
            -DMATTERLEAST_USE_KEYCHAIN=OFF \
            -DBUILD_TESTING=ON -DMATTERLEAST_BUNDLED_QCA="$QCA_BUNDLED" -DWARNINGS_AS_ERRORS=ON \
            -DMATTERLEAST_PLUGIN_VERIFY_KEY_FILE="$RUNNER_TEMP/matterleast-signing/public.pem" \
            -DMATTERLEAST_PLUGIN_SIGNING_KEY_FILE="$RUNNER_TEMP/matterleast-signing/private.pem" \
            '-DMATTERLEAST_UPDATE_MANIFEST_URL=https://updates.example.test/{channel}/windows-x64.json'
      - name: Verify signed plugins and update manifests (QCA RSA/SHA256)
        run: |
          set -euo pipefail
          printf '%s\n' '{"schema":1,"channel":"stable","platform":"windows-x64"}' \
            > "$RUNNER_TEMP/matterleast-signing/windows-x64.json"
          bash scripts/sign-update-manifest.sh \
            "$RUNNER_TEMP/matterleast-signing/windows-x64.json" \
            "$RUNNER_TEMP/matterleast-signing/private.pem"
          cmake --build build-trusted \
            --target trusted-plugin-load-test update-trust-policy-test --parallel 4
          MATTERLEAST_SIGNED_UPDATE_TEST_PATH="$RUNNER_TEMP/matterleast-signing/windows-x64.json" \
            ctest --test-dir build-trusted \
              -R '^(trusted-plugin-load-test|update-trust-policy-test)$' \
              --output-on-failure
